<script>
/* 护生之约 · sound.js
 * Every sound is synthesised with the Web Audio API, so there are no audio
 * files. Melodies use the Chinese pentatonic scale (宫商角徵羽). */
(function () {
  'use strict';

  let ctx = null, master = null, noiseBuf = null;
  let enabled = true;

  const NOTES = { C4: 261.63, D4: 293.66, E4: 329.63, G4: 392.0, A4: 440.0, C5: 523.25, D5: 587.33, E5: 659.25, G5: 783.99, A5: 880.0, C6: 1046.5 };

  function ensure() {
    if (!enabled) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); } catch (e) { return null; }
      master = ctx.createGain();
      master.gain.value = 0.55;
      master.connect(ctx.destination);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  }

  function env(g, t, a, peak, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  /* A plucked-string tone, a little like a guqin or zheng. */
  function pluck(freq, when = 0, dur = 1.4, vol = 0.22) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + when;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(freq * 6, t);
    lp.frequency.exponentialRampToValueAtTime(freq * 1.5, t + dur * 0.6);
    const g = c.createGain();
    env(g, t, 0.006, vol, dur);
    const o1 = c.createOscillator(); o1.type = 'triangle'; o1.frequency.value = freq;
    const o2 = c.createOscillator(); o2.type = 'sine'; o2.frequency.value = freq * 2.005;
    const g2 = c.createGain(); g2.gain.value = 0.35;
    o1.connect(lp); o2.connect(g2); g2.connect(lp); lp.connect(g); g.connect(master);
    o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }

  function melody(names, step = 0.18, vol = 0.2) {
    names.forEach((n, i) => { if (n) pluck(NOTES[n] || n, i * step, 1.3, vol); });
  }

  function noise(when, dur, f1, f2, vol, type = 'bandpass', q = 1) {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + when;
    const src = c.createBufferSource(); src.buffer = noiseBuf;
    const bp = c.createBiquadFilter(); bp.type = type; bp.Q.value = q;
    bp.frequency.setValueAtTime(f1, t); bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); env(g, t, 0.02, vol, dur);
    src.connect(bp); bp.connect(g); g.connect(master);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }

  function tone(f1, f2, when, dur, vol, type = 'sine') {
    const c = ensure(); if (!c) return;
    const t = c.currentTime + when;
    const o = c.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); env(g, t, 0.01, vol, dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.05);
  }

  const Sound = {
    unlock: ensure,
    setEnabled(on) {
      enabled = !!on;
      if (!ctx) return;
      if (!enabled && ctx.state === 'running') ctx.suspend().catch(() => {});
      if (enabled && ctx.state === 'suspended') ctx.resume().catch(() => {});
    },
    get enabled() { return enabled; },
    tap() { pluck(NOTES.G5, 0, 0.5, 0.08); },
    page() { noise(0, 0.28, 1800, 700, 0.06, 'bandpass', 0.8); },
    swish() { noise(0, 0.22, 900, 2600, 0.12, 'bandpass', 0.9); },
    plop() { tone(520, 160, 0, 0.18, 0.18); noise(0.02, 0.12, 1200, 500, 0.04); },
    splash() { noise(0, 0.35, 2400, 600, 0.09, 'bandpass', 0.6); tone(300, 120, 0, 0.2, 0.08); },
    chirp(n = 2, base = 2600) {
      for (let i = 0; i < n; i++) { tone(base, base * 1.45, i * 0.13, 0.08, 0.07); tone(base * 1.4, base * 1.1, i * 0.13 + 0.07, 0.06, 0.05); }
    },
    oops() { pluck(NOTES.D4, 0, 0.6, 0.18); pluck(NOTES.C4 * 0.94, 0.12, 0.8, 0.14); },
    soft() { pluck(NOTES.E5, 0, 0.9, 0.12); },
    good() { melody(['E5', 'G5', 'A5'], 0.1, 0.13); },
    hot() { noise(0, 0.25, 3000, 1200, 0.08, 'highpass', 0.7); tone(700, 300, 0, 0.18, 0.06, 'triangle'); },
    bump() { tone(180, 90, 0, 0.14, 0.2); noise(0, 0.08, 800, 300, 0.05); },
    stamp() { tone(140, 60, 0, 0.22, 0.28); noise(0, 0.07, 1500, 400, 0.08, 'lowpass', 0.5); },
    blow() { noise(0, 0.7, 600, 250, 0.1, 'bandpass', 0.5); },
    wind() { noise(0, 1.4, 300, 900, 0.12, 'bandpass', 0.4); },
    win() { melody(['C5', 'D5', 'E5', 'G5', 'A5', 'C6'], 0.14, 0.16); },
    song() { melody(['E5', 'G5', 'A5', 'G5', 'E5', 'D5', 'E5', 'G5', 'C6', 'A5'], 0.2, 0.14); },
    promise() { melody(['G4', 'A4', 'C5', null, 'D5', 'E5', 'D5', 'C5'], 0.26, 0.15); },
  };

  window.Sound = Sound;
})();

</script>
<script>
/* 护生之约 · core.js
 * Game state, words, screens and the shared pieces of UI:
 * the cat guide, story cards, seals, the album leaf that appears when a
 * page is finished, and saving pictures. */
(function () {
  'use strict';

  const HS = (window.HS = {});
  const NS = 'http://www.w3.org/2000/svg';
  const KEY = 'husheng-zhiyue:v1';
  const DRAFT_KEY = 'husheng-zhiyue:draft';
  HS.NS = NS;

  /* ---------- state (kept in this browser only) ---------- */
  function detectLang() {
    try {
      const l = (navigator.languages && navigator.languages[0]) || navigator.language || '';
      return /^zh/i.test(l) ? 'zh' : 'en';
    } catch (e) { return 'zh'; }
  }
  const fresh = () => ({ lang: detectLang(), name: '', sound: true, easy: false, pages: {}, prologue: false, quiz: { best: 0, passed: false } });

  function load() {
    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { saved = null; }
    const s = Object.assign(fresh(), saved && typeof saved === 'object' ? saved : {});
    if (!s.pages || typeof s.pages !== 'object') s.pages = {};
    if (!s.quiz || typeof s.quiz !== 'object') s.quiz = { best: 0, passed: false };
    if (s.lang !== 'zh' && s.lang !== 'en') s.lang = detectLang();
    return s;
  }
  HS.state = load();
  HS.save = () => { try { localStorage.setItem(KEY, JSON.stringify(HS.state)); } catch (e) { /* storage unavailable */ } };
  HS.loadDraft = () => { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || 'null'); } catch (e) { return null; } };
  HS.saveDraft = (d) => { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(d)); return true; } catch (e) { return false; } };
  HS.reset = () => {
    const lang = HS.state.lang;
    HS.state = fresh();
    HS.state.lang = lang;
    try { localStorage.removeItem(KEY); localStorage.removeItem(DRAFT_KEY); } catch (e) { /* ignore */ }
    HS.save();
  };

  HS.progress = () => {
    let done = 0, seals = 0;
    for (const c of HS.chapters) {
      const p = HS.state.pages[c.id];
      if (p && p.done) { done++; seals += p.seals || 0; }
    }
    return { done, seals, total: HS.chapters.length };
  };

  /* ---------- words ---------- */
  HS.t = function (key, vars) {
    const d = window.STR[HS.state.lang] || window.STR.zh;
    let v = d[key];
    if (v === undefined) v = window.STR.zh[key];
    if (v === undefined) return key;
    if (vars && typeof v === 'string') v = v.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
    return v;
  };
  HS.zh = (key) => window.STR.zh[key];
  HS.en = () => HS.state.lang === 'en';
  const ZH_NUM = ['〇', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];
  HS.pageNo = (n) => HS.t('ui.pageN', { n: HS.en() ? n : ZH_NUM[n] || n });

  HS.applyLang = function () {
    document.documentElement.lang = HS.en() ? 'en' : 'zh-CN';
    document.title = HS.en() ? '护生之约 · A Promise to Protect Life' : '护生之约';
  };
  HS.setLang = function (lang) {
    HS.state.lang = lang;
    HS.save();
    HS.applyLang();
    HS.go(current || 'title', { keepHash: true });
  };

  /* ---------- DOM helpers ---------- */
  function h(tag, props, ...kids) {
    const el = document.createElement(tag);
    if (props) {
      for (const k in props) {
        const v = props[k];
        if (v == null || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'html') el.innerHTML = v;
        else if (k === 'text') el.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const c of kids.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.append(c.nodeType ? c : document.createTextNode(String(c)));
    }
    return el;
  }
  HS.h = h;

  function svgEl(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }
  HS.svgEl = svgEl;

  /* Parse SVG markup into a new <g> inside `parent`. */
  HS.sprite = function (parent, markup, attrs) {
    const g = svgEl('g', attrs);
    g.innerHTML = markup;
    parent.appendChild(g);
    return g;
  };

  HS.setPos = function (el, x, y, rot = 0, s = 1, flip = false) {
    el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})${rot ? ` rotate(${rot.toFixed(1)})` : ''}${s !== 1 || flip ? ` scale(${flip ? -s : s} ${s})` : ''}`);
  };

  HS.shuffle = function (arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  HS.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  HS.lerp = (a, b, t) => a + (b - a) * t;
  HS.dist = (a, b, c, d) => Math.hypot(a - c, b - d);

  HS.reducedMotion = () => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };

  /* ---------- icons ---------- */
  const ICONS = {
    soundOn: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 8.5c1.2 1 1.8 2.2 1.8 3.5s-.6 2.5-1.8 3.5M18.6 6c2 1.7 3 3.7 3 6s-1 4.3-3 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  };
  HS.icon = (name) => ICONS[name] || '';

  HS.soundButton = function () {
    const b = h('button', { class: 'btn btn-small btn-icon', type: 'button' });
    const paint = () => {
      b.innerHTML = HS.icon(HS.state.sound ? 'soundOn' : 'soundOff');
      b.setAttribute('aria-label', HS.t('ui.sound'));
      b.setAttribute('aria-pressed', HS.state.sound ? 'true' : 'false');
      b.title = HS.t(HS.state.sound ? 'ui.soundOn' : 'ui.soundOff');
    };
    b.addEventListener('click', () => {
      HS.state.sound = !HS.state.sound;
      HS.save();
      Sound.setEnabled(HS.state.sound);
      if (HS.state.sound) Sound.tap();
      paint();
      HS.toast(HS.t(HS.state.sound ? 'ui.soundOn' : 'ui.soundOff'));
    });
    paint();
    return b;
  };

  HS.langButton = function () {
    return h('button', {
      class: 'btn btn-small', type: 'button', lang: HS.en() ? 'zh-CN' : 'en',
      onclick: () => HS.setLang(HS.en() ? 'zh' : 'en'),
    }, HS.t('ui.lang'));
  };

  /* ---------- toast & modal ---------- */
  HS.toast = function (msg) {
    const root = document.getElementById('toast-root');
    if (!root) return;
    const el = h('div', { class: 'toast', role: 'status' }, msg);
    root.appendChild(el);
    setTimeout(() => el.remove(), 2700);
  };

  let modalClose = null;
  HS.modal = function (content, opts = {}) {
    HS.closeModal();
    const root = document.getElementById('modal-root');
    const scrim = h('div', { class: 'scrim', role: 'dialog', 'aria-modal': 'true', 'aria-label': opts.label || '' }, content);
    const onKey = (e) => { if (e.key === 'Escape' && opts.escape !== false) { e.preventDefault(); HS.closeModal(); if (opts.onClose) opts.onClose(); } };
    document.addEventListener('keydown', onKey);
    root.appendChild(scrim);
    const lastFocus = document.activeElement;
    modalClose = () => {
      document.removeEventListener('keydown', onKey);
      scrim.remove();
      modalClose = null;
      if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
    };
    requestAnimationFrame(() => {
      const f = scrim.querySelector('[data-autofocus]') || scrim.querySelector('button, [href], input, textarea');
      if (f) f.focus({ preventScroll: true });
    });
    return HS.closeModal;
  };
  HS.closeModal = () => { if (modalClose) modalClose(); };

  /* ---------- art helpers ---------- */
  HS.catSVG = (pose) => Art.svg(pose === 'sleep' ? Art.place(Art.cat({ pose: 'sleep' }), { x: 64, y: 90 }) : Art.place(Art.cat(), { x: 60, y: 120, s: 0.98 }), 120, 124);

  HS.sealsRow = function (n, max = 3, text) {
    const row = h('div', { class: 'leaf-seals', 'aria-label': HS.t('ui.sealsN', { n }) });
    for (let i = 0; i < max; i++) {
      if (i < n) row.appendChild(h('span', { html: Art.sealSVG(text || '心', { cls: 'seal-svg' }) }).firstChild);
      else row.appendChild(h('span', { class: 'seal-empty' }));
    }
    return row;
  };

  HS.playerSealText = () => (HS.state.name || '').trim() || '护生';

  /* ---------- screens ---------- */
  HS.screens = {};
  HS.chapters = [];
  let current = null, cleanup = null;
  HS.current = () => current;

  HS.go = function (id, params = {}) {
    if (cleanup) { try { cleanup(); } catch (e) { console.error(e); } cleanup = null; }
    HS.closeModal();
    const scr = HS.screens[id] || HS.screens.title;
    if (!HS.screens[id]) id = 'title';
    current = id;
    const root = document.getElementById('screen');
    root.innerHTML = '';
    document.body.dataset.screen = id;
    document.body.classList.toggle('is-playing', !!scr.fullscreen);
    window.scrollTo(0, 0);
    if (!params.keepHash) {
      try { history.replaceState(null, '', id === 'title' ? location.pathname + location.search : '#' + id); } catch (e) { /* sandboxed */ }
    }
    cleanup = scr.enter(root, params) || null;
    root.focus({ preventScroll: true });
  };

  HS.routeFromHash = function () {
    const id = (location.hash || '').replace(/^#/, '');
    return HS.screens[id] ? id : null;
  };

  /* ---------- saving pictures ---------- */
  let dlPromise = null;
  function downloadsCap() {
    if (!dlPromise) {
      try {
        dlPromise = window.claude && typeof window.claude.use === 'function'
          ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
          : Promise.resolve(null);
      } catch (e) { dlPromise = Promise.resolve(null); }
    }
    return dlPromise;
  }
  HS.warmDownloads = downloadsCap;

  /* Returns 'saved', 'declined' or 'manual' (the viewer saves the image by hand). */
  HS.saveBlob = async function (blob, filename) {
    const dl = await downloadsCap();
    if (dl) {
      try { await dl.save({ filename, data: blob }); return 'saved'; }
      catch (e) { return e && (e.code === 'declined' || e.code === 'rate_limited') ? 'declined' : 'manual'; }
    }
    if (window.claude) return 'manual';
    try {
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: filename });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return 'saved';
    } catch (e) { return 'manual'; }
  };

  /* Show a finished picture (painting or certificate) with a save button. */
  HS.showPicture = function (canvas, filename, opts = {}) {
    const url = canvas.toDataURL('image/png');
    const msg = h('p', { class: 'result-msg', 'aria-live': 'polite' }, HS.t('ui.saveManual'));
    const saveBtn = h('button', { class: 'btn btn-seal', type: 'button', 'data-autofocus': '' }, HS.t('ui.save'));
    saveBtn.addEventListener('click', () => {
      msg.textContent = HS.t('ui.saving');
      canvas.toBlob(async (blob) => {
        if (!blob) { msg.textContent = HS.t('ui.saveManual'); return; }
        const r = await HS.saveBlob(blob, filename);
        msg.textContent = r === 'saved' ? HS.t('ui.saved') : r === 'declined' ? HS.t('ui.saveDeclined') : HS.t('ui.saveManual');
      }, 'image/png');
    });
    const actions = h('div', { class: 'result-actions' }, msg, h('div', { class: 'toolbar' }, opts.extra || null, saveBtn, h('button', { class: 'btn', type: 'button', onclick: () => { HS.closeModal(); if (opts.onClose) opts.onClose(); } }, opts.closeLabel || HS.t('ui.close'))));
    const box = h('div', { class: 'result' }, opts.title ? h('h2', {}, opts.title) : null, h('img', { class: 'result-img', src: url, alt: opts.alt || opts.title || '' }), actions);
    HS.modal(box, { label: opts.title, onClose: opts.onClose });
  };

  /* ---------- the cat guide ---------- */
  function makeGuide() {
    const bubble = h('div', { class: 'bubble', role: 'status', 'aria-live': 'polite' });
    let factIndex = Math.floor(Math.random() * 8);
    const catBtn = h('button', { class: 'guide-cat', type: 'button', 'aria-label': HS.t('ui.catTap'), title: HS.t('ui.catTap'), html: HS.catSVG() });
    const el = h('div', { class: 'guide' }, catBtn, bubble);
    let timer = null;
    function say(text, ms = 3600) {
      bubble.textContent = text;
      bubble.classList.add('is-on');
      clearTimeout(timer);
      if (ms) timer = setTimeout(() => bubble.classList.remove('is-on'), ms);
    }
    catBtn.addEventListener('click', () => {
      const facts = HS.t('cat.facts');
      factIndex = (factIndex + 1) % facts.length;
      Sound.soft();
      say(facts[factIndex], 5200);
    });
    return { el, say, hide() { bubble.classList.remove('is-on'); }, destroy() { clearTimeout(timer); } };
  }
  HS.makeGuide = makeGuide;

  /* ---------- chapters ---------- */
  HS.chapter = function (def) {
    HS.chapters.push(def);
    HS.chapters.sort((a, b) => a.no - b.no);
    HS.screens[def.id] = {
      fullscreen: def.fullscreen !== false,
      enter: (root, params) => (def.enter ? def.enter(root, params) : runChapter(def, root, params)),
    };
  };
  HS.chapterById = (id) => HS.chapters.find((c) => c.id === id);

  function hud(def, extra) {
    const stat = h('p', { class: 'hud-stat', 'aria-live': 'polite' });
    const bar = h('header', { class: 'hud' },
      h('button', { class: 'btn btn-small', type: 'button', onclick: () => { Sound.page(); HS.go('album'); } }, '‹ ' + HS.t('ui.album')),
      h('h1', { class: 'hud-title' }, h('span', { class: 'hud-no' }, HS.pageNo(def.no)), h('span', {}, HS.t(def.key + '.title'))),
      stat,
      extra || HS.soundButton());
    return { bar, stat };
  }
  HS.hud = hud;

  function runChapter(def, root) {
    const t = HS.t;
    const { bar, stat } = hud(def);
    const svg = svgEl('svg', { viewBox: '0 0 1000 625', class: 'stage', role: 'img', 'aria-label': t(def.key + '.title'), preserveAspectRatio: 'xMidYMid meet' });
    const overlay = h('div', { class: 'overlay' });
    const guide = makeGuide();
    const wrap = h('div', { class: 'stage-wrap' }, svg, guide.el, overlay);
    root.appendChild(h('section', { class: 'chapter' }, bar, h('p', { class: 'rotate-hint' }, t('ui.rotate')), wrap));
    const ctx = makeCtx(def, svg, overlay, guide, stat);
    let alive = true;

    (async () => {
      try {
        const preview = ctx.add('preview', `<rect width="1000" height="625" fill="#f4eee1"/>` + def.painting());
        await ctx.card({
          eyebrow: `${HS.pageNo(def.no)} · ${t(def.key + '.season')} · ${t(def.key + '.animal')}`,
          title: t(def.key + '.title'),
          body: [t(def.key + '.intro'), def.skipHowto ? null : h('p', { class: 'muted' }, h('b', {}, t('ch.howto') + '：'), ' ', t(def.key + '.howto'))],
          button: t('ui.start'),
          cat: true,
        });
        if (!alive) return;
        preview.parentNode.remove();
        Sound.unlock();
        const result = await def.play(ctx);
        if (!alive) return;
        await ctx.wait(700);
        if (!alive) return;
        await ctx.card({
          eyebrow: t('ui.pov'),
          title: t(def.key + '.povTitle'),
          art: def.pov ? def.pov() : null,
          body: [t(def.key + '.pov')],
          ask: t(def.askKey || def.key + '.ask'),
          button: t('ui.toPage'),
        });
        if (!alive) return;
        HS.finishPage(def, result && result.seals ? result.seals : 1);
      } catch (e) {
        if (e && e.message !== 'aborted') console.error(e);
      }
    })();

    return () => { alive = false; ctx.destroy(); guide.destroy(); };
  }

  function makeCtx(def, svg, overlay, guide, statEl) {
    const loops = new Set(), timers = new Set(), listeners = [];
    let destroyed = false;
    const layers = {};
    const ctx = {
      svg, overlay, guide, def,
      t: HS.t,
      easy: !!HS.state.easy,
      speed: HS.state.easy ? 0.68 : 1,
      reach: HS.state.easy ? 1.35 : 1,
      get destroyed() { return destroyed; },
      layer(name) {
        if (!layers[name]) { layers[name] = svgEl('g', { class: 'layer-' + name }); svg.appendChild(layers[name]); }
        return layers[name];
      },
      add(layerName, markup, attrs) { return HS.sprite(ctx.layer(layerName), markup, attrs); },
      stat(text) { statEl.textContent = text; },
      say(text, ms) { guide.say(text, ms); },
      loop(fn) {
        let last = performance.now(), raf = 0, on = true;
        const tick = (now) => {
          if (!on || destroyed) return;
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          fn(dt, now / 1000);
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        const stop = () => { on = false; cancelAnimationFrame(raf); loops.delete(stop); };
        loops.add(stop);
        return stop;
      },
      after(ms, fn) {
        const id = setTimeout(() => { timers.delete(id); if (!destroyed) fn(); }, ms);
        timers.add(id);
        return id;
      },
      wait(ms) { return new Promise((res, rej) => ctx.after(ms, res)); },
      on(target, type, fn, opts) { target.addEventListener(type, fn, opts); listeners.push([target, type, fn, opts]); },
      point(e) {
        const m = svg.getScreenCTM();
        if (!m) return { x: 0, y: 0 };
        const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
        return { x: p.x, y: p.y };
      },
      float(x, y, text, color, size = 30) {
        const el = svgEl('text', { x: x.toFixed(0), y: y.toFixed(0), 'text-anchor': 'middle', class: 'float-text', 'font-size': size, fill: color || Art.C.seal });
        el.textContent = text;
        ctx.layer('fx').appendChild(el);
        if (el.animate && !HS.reducedMotion()) {
          const a = el.animate([{ transform: 'translateY(0)', opacity: 1 }, { transform: 'translateY(-46px)', opacity: 0 }], { duration: 1300, easing: 'ease-out' });
          a.onfinish = () => el.remove();
        } else ctx.after(1200, () => el.remove());
      },
      card(o) {
        return new Promise((resolve) => {
          const actions = h('div', { class: 'card-actions' });
          const body = (Array.isArray(o.body) ? o.body : [o.body]).filter(Boolean).map((b) => (typeof b === 'string' ? h('p', {}, b) : b));
          const content = h('div', { style: 'display:grid;gap:.7rem' }, ...body);
          const card = h('div', { class: 'card', role: 'dialog', 'aria-label': o.title || '' },
            o.eyebrow ? h('p', { class: 'eyebrow' }, o.eyebrow) : null,
            o.title ? h('h2', {}, o.title) : null,
            o.art ? h('div', { class: 'pov-art', html: Art.svg(o.art, 1000, 420) }) : null,
            o.cat ? h('div', { class: 'card-row' }, h('div', { class: 'guide-cat', html: HS.catSVG() }), content) : content,
            o.ask ? h('div', { class: 'ask' }, h('b', {}, HS.t('ui.talk')), o.ask) : null,
            actions);
          const done = (v) => { card.remove(); resolve(v); };
          if (o.secondary) actions.appendChild(h('button', { class: 'btn', type: 'button', onclick: () => { Sound.tap(); done('secondary'); } }, o.secondary));
          const primary = h('button', { class: 'btn btn-seal', type: 'button', onclick: () => { Sound.unlock(); Sound.page(); done('primary'); } }, o.button || HS.t('ui.continue'));
          actions.appendChild(primary);
          overlay.appendChild(card);
          guide.hide();
          requestAnimationFrame(() => primary.focus({ preventScroll: true }));
        });
      },
      /* A dialogue with options. `options`: [{label, value, reply, hint, correct}] */
      dialogue(o) {
        return new Promise((resolve) => {
          const list = h('div', { class: 'choice-list' });
          const replyBox = h('div', { 'aria-live': 'polite', style: 'display:grid;gap:.5rem' });
          const card = h('div', { class: 'card' },
            o.eyebrow ? h('p', { class: 'eyebrow' }, o.eyebrow) : null,
            o.speaker ? h('div', { class: 'reply' }, h('span', { class: 'who' }, o.speaker + '：'), o.line) : null,
            o.prompt ? h('h2', {}, o.prompt) : null,
            list, replyBox);
          const tries = [];
          o.options.forEach((opt) => {
            const b = h('button', { class: 'choice', type: 'button' }, opt.label);
            b.addEventListener('click', async () => {
              Sound.tap();
              tries.push(opt.value);
              replyBox.innerHTML = '';
              if (opt.reply) replyBox.appendChild(h('div', { class: 'reply' }, o.replier ? h('span', { class: 'who' }, o.replier + '：') : null, opt.reply));
              if (opt.correct) {
                b.classList.add('is-right');
                list.querySelectorAll('button').forEach((x) => { x.disabled = true; });
                if (o.onRight) o.onRight(opt);
                const next = h('button', { class: 'btn btn-seal', type: 'button', onclick: () => { Sound.page(); card.remove(); resolve({ value: opt.value, tries }); } }, o.nextLabel || HS.t('ui.continue'));
                if (opt.after) replyBox.appendChild(opt.after);
                replyBox.appendChild(h('div', { class: 'card-actions' }, next));
                requestAnimationFrame(() => next.focus({ preventScroll: true }));
              } else {
                b.classList.add('is-wrong');
                b.disabled = true;
                if (opt.hint) replyBox.appendChild(h('p', { class: 'muted' }, opt.hint));
                if (o.onWrong) o.onWrong(opt);
              }
            });
            list.appendChild(b);
          });
          overlay.appendChild(card);
          guide.hide();
        });
      },
      destroy() {
        destroyed = true;
        loops.forEach((s) => s());
        timers.forEach((id) => clearTimeout(id));
        listeners.forEach(([tg, ty, fn, op]) => tg.removeEventListener(ty, fn, op));
      },
    };
    return ctx;
  }
  HS.makeCtx = makeCtx;

  /* ---------- the finished album leaf ---------- */
  HS.finishPage = function (def, seals) {
    seals = HS.clamp(Math.round(seals || 1), 1, 3);
    const prev = HS.state.pages[def.id];
    HS.state.pages[def.id] = { done: true, seals: Math.max(seals, prev && prev.seals ? prev.seals : 0) };
    HS.save();
    showLeaf(def, seals);
  };

  /* Split an inscription into columns at the end of each clause. */
  HS.columns = (text) => {
    const out = [];
    let cur = '';
    for (const ch of Array.from(text || '')) {
      cur += ch;
      if ('；。！？'.indexOf(ch) >= 0) { out.push(cur.trim()); cur = ''; }
    }
    if (cur.trim()) out.push(cur.trim());
    return out;
  };

  function inscriptionBlock(title, verse, by) {
    return h('div', { class: 'inscription', lang: 'zh-CN' },
      h('div', { class: 'v-title' }, title),
      h('div', { class: 'v-cols' }, HS.columns(verse).map((c) => h('span', { class: 'v-col' }, c))),
      by ? h('div', { class: 'v-by' }, by) : null);
  }
  HS.inscriptionBlock = inscriptionBlock;

  function showLeaf(def, seals) {
    const orig = def.original ? HS.painting(def.original) : null;
    if (!orig) { buildLeaf(def, seals, false); return; }
    let built = false;
    const go = (ok) => { if (!built) { built = true; buildLeaf(def, seals, ok); } };
    HS.hasOriginal(def.original).then(go);
    setTimeout(() => go(false), 1500);
  }

  function buildLeaf(def, seals, showOriginal) {
    const t = HS.t, k = def.key, en = HS.en();
    const orig = def.original ? HS.painting(def.original) : null;
    const sealBox = h('div', { class: 'leafpage-seals' });
    let art, inscription, verseLine;
    if (orig && showOriginal) {
      art = h('div', { class: 'leafpage-art is-original' }, HS.original(def.original), sealBox);
      inscription = inscriptionBlock(orig.title, orig.poem, orig.poemBy);
      verseLine = h('div', { class: 'leafpage-orig-note' },
        h('p', { class: 'eyebrow', style: 'color:var(--seal)' }, t('orig.unlocked')),
        en && orig.poemEn ? h('p', { class: 'leafpage-verse-en' }, `“${orig.poemEn}” — ${orig.poemByEn}`) : null);
    } else {
      art = h('div', { class: 'leafpage-art', html: Art.svg(def.painting(), 1000, 625, { label: t(k + '.title') }) }, sealBox);
      inscription = inscriptionBlock(HS.zh(k + '.title'), HS.zh(k + '.verse'), '—— ' + HS.zh(k + '.verseBy'));
      verseLine = en
        ? h('p', { class: 'leafpage-verse-en' }, `“${t(k + '.verseEn')}” — ${t(k + '.verseBy')}`)
        : h('p', { class: 'muted' }, t(k + '.verseGloss'));
    }
    const top = h('div', { class: 'leafpage-top' }, art, inscription);
    const cards = [];
    if (orig) {
      cards.push(h('div', { class: 'info info-orig' },
        h('h3', {}, `${t('orig.heading')}《${orig.title}》`),
        h('p', { class: 'reveal-sub' }, en ? `${orig.titleEn} · ${orig.sourceEn}` : orig.source),
        showOriginal ? null : h('p', { class: 'poem-zh', lang: 'zh-CN', style: 'font-size:1.15rem' }, orig.poem),
        showOriginal || !en ? null : h('p', { class: 'poem-en' }, orig.poemEn),
        orig.note ? h('p', {}, en ? orig.noteEn : orig.note) : null));
    }
    cards.push(h('div', { class: 'info' }, h('h3', {}, t('ui.know')), h('p', {}, t(k + '.know'))));
    cards.push(h('div', { class: 'info' }, h('h3', {}, t(def.bookLabel || 'ui.fromBook')), h('p', {}, t(k + '.book'))));
    if (orig && showOriginal) {
      cards.push(h('div', { class: 'info' }, h('h3', {}, t('leaf.verseCard')),
        h('p', { class: 'poem-zh', lang: 'zh-CN', style: 'font-size:1.15rem' }, HS.zh(k + '.verse')),
        h('p', {}, en ? `“${t(k + '.verseEn')}” — ${t(k + '.verseBy')}` : `${t(k + '.verseGloss')}（${HS.zh(k + '.verseBy')}）`)));
    }
    const info = h('div', { class: 'leafpage-info' }, cards);
    const why = t(seals >= 3 ? 'ch.sealWhy3' : seals === 2 ? 'ch.sealWhy2' : 'ch.sealWhy1');
    const foot = h('div', { class: 'leafpage-foot' },
      h('div', { class: 'got' }, HS.sealsRow(seals), h('span', {}, t('ch.sealsGot', { n: seals }) + (en ? '. ' : '。') + why)),
      h('div', { class: 'toolbar' },
        h('button', { class: 'btn', type: 'button', onclick: () => { HS.closeModal(); HS.go(def.id); } }, t('ch.replay')),
        h('button', { class: 'btn btn-seal', type: 'button', 'data-autofocus': '', onclick: () => { HS.closeModal(); Sound.page(); HS.go('album', { highlight: def.id }); } }, t('ui.collect'))));
    const inner = h('div', { class: 'leafpage-inner' }, h('p', { class: 'eyebrow', style: 'color:var(--seal);letter-spacing:.1em;font-size:.9rem' }, `${HS.pageNo(def.no)} · ${t(k + '.title')} · ${t('ch.done')}`), top, verseLine, info, foot);
    HS.modal(h('div', { class: 'leafpage' }, inner), { label: t(k + '.title'), escape: false });
    Sound.win();
    const sealText = HS.playerSealText();
    for (let i = 0; i < seals; i++) {
      setTimeout(() => {
        const s2 = h('span', { class: 'stamp', html: Art.sealSVG(i === 0 ? sealText : '心', { cls: 'seal-svg' }) });
        sealBox.appendChild(s2);
        Sound.stamp();
      }, 700 + i * 380);
    }
  }
  HS.showLeaf = showLeaf;

  /* ---------- Feng Zikai's original paintings ---------- */
  HS.painting = (id) => (window.PAINTINGS || {})[id] || null;
  HS.paintingSrc = (id) => {
    const data = window.PAINTING_DATA && window.PAINTING_DATA[id];
    if (data) return data;
    const p = HS.painting(id);
    return p ? p.file : '';
  };
  const imageState = {};
  /* Resolves true when the scan of a painting can be loaded. */
  HS.hasOriginal = function (id) {
    if (!imageState[id]) {
      imageState[id] = new Promise((resolve) => {
        const src = HS.paintingSrc(id);
        if (!src) return resolve(false);
        const img = new Image();
        img.onload = () => resolve(img.naturalWidth > 0);
        img.onerror = () => resolve(false);
        img.src = src;
      });
    }
    return imageState[id];
  };

  /* A framed original painting with its title, source and inscription.
   * opts.sketch: SVG markup (1000×700) shown when the scan is missing.
   * opts.hideText: show only the picture and caption (used before a riddle is answered). */
  HS.original = function (id, opts = {}) {
    const p = HS.painting(id);
    if (!p) return h('div');
    const en = HS.en();
    const frame = h('div', { class: 'original-frame' });
    const badge = h('span', { class: 'original-badge' });
    const caption = h('figcaption', { class: 'original-cap' },
      opts.hideTitle ? null : h('span', { class: 'original-title', lang: 'zh-CN' }, `《${p.title}》`),
      opts.hideTitle || !en ? null : h('span', { class: 'original-title-en' }, p.titleEn),
      h('span', { class: 'original-src' }, en ? p.sourceEn : p.source),
      badge);
    const fig = h('figure', { class: 'original' + (opts.compact ? ' is-compact' : '') }, h('div', { class: 'mount' }, frame), caption);
    const showSketch = () => {
      frame.innerHTML = opts.sketch ? Art.svg(opts.sketch, 1000, 700, { label: en ? p.titleEn : p.title }) : '';
      frame.classList.add('is-sketch');
      badge.textContent = HS.t('orig.sketch');
      fig.dataset.state = 'sketch';
    };
    const img = h('img', { alt: en ? `${p.titleEn} — ${HS.t('orig.by')}` : `${p.title}，${HS.t('orig.by')}`, decoding: 'async' });
    frame.appendChild(img);
    badge.textContent = HS.t('orig.real');
    fig.dataset.state = 'loading';
    img.addEventListener('load', () => { fig.dataset.state = 'real'; });
    img.addEventListener('error', showSketch);
    img.src = HS.paintingSrc(id);
    return fig;
  };

  /* The inscription block for an original painting. */
  HS.originalText = function (id) {
    const p = HS.painting(id);
    if (!p || !p.poem) return null;
    const en = HS.en();
    return h('div', { class: 'original-text' },
      h('p', { class: 'poem-zh', lang: 'zh-CN' }, p.poem),
      h('p', { class: 'reveal-sub' }, en ? p.poemByEn : p.poemBy),
      en && p.poemEn ? h('p', { class: 'poem-en' }, p.poemEn) : null,
      p.note ? h('p', { class: 'muted', style: 'font-size:.95rem' }, en ? p.noteEn : p.note) : null);
  };

  /* ---------- canvas helpers shared by the studio and the certificate ---------- */
  HS.svgToImage = function (svgMarkup) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarkup);
    });
  };

  HS.fontsReady = async function (samples) {
    try {
      if (document.fonts && document.fonts.load) {
        await Promise.race([
          Promise.all(samples.map((s) => document.fonts.load(s[0], s[1]))),
          new Promise((r) => setTimeout(r, 2500)),
        ]);
      }
    } catch (e) { /* use fallback fonts */ }
  };

  /* Paint a rice-paper ground onto a canvas. */
  HS.paperFill = function (g, w, h2, base = '#f5efe1') {
    g.fillStyle = base;
    g.fillRect(0, 0, w, h2);
    const rnd = (() => { let a = 1234567; return () => { a = (a * 16807) % 2147483647; return a / 2147483647; }; })();
    g.save();
    for (let i = 0; i < (w * h2) / 90; i++) {
      g.fillStyle = `rgba(120,100,70,${0.02 + rnd() * 0.05})`;
      g.fillRect(rnd() * w, rnd() * h2, 1 + rnd() * 1.5, 1 + rnd() * 1.5);
    }
    g.strokeStyle = 'rgba(120,100,70,0.07)';
    g.lineWidth = 1;
    for (let i = 0; i < (w * h2) / 9000; i++) {
      const x = rnd() * w, y = rnd() * h2, l = 20 + rnd() * 60, a = rnd() * Math.PI;
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a) * l * 0.5 + 6, y + Math.sin(a) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
    g.restore();
  };

  /* A red name seal drawn on a canvas. */
  HS.drawSeal = function (o, text, x, y, size) {
    const chars = Art.sealChars(text);
    o.save();
    o.fillStyle = '#b5362c';
    o.beginPath();
    if (o.roundRect) o.roundRect(x, y, size, size, 8); else o.rect(x, y, size, size);
    o.fill();
    o.strokeStyle = 'rgba(248,243,232,.85)'; o.lineWidth = 2.5; o.strokeRect(x + 7, y + 7, size - 14, size - 14);
    o.fillStyle = '#f8f3e8'; o.textAlign = 'center'; o.textBaseline = 'middle';
    const brush = '"Ma Shan Zheng","STKaiti","KaiTi",serif';
    const cell = size / 2;
    const put = (ch, cx, cy, fs) => { o.font = `${fs}px ${brush}`; o.fillText(ch, x + cx, y + cy); };
    if (chars.length === 1) put(chars[0], size / 2, size / 2 + 2, chars[0].length > 1 ? size * 0.42 : size * 0.66);
    else if (chars.length === 2) { put(chars[0], size / 2, cell * 0.58, size * 0.42); put(chars[1], size / 2, cell * 1.45, size * 0.42); }
    else if (chars.length === 3) { put(chars[0], cell * 1.44, size / 2, size * 0.44); put(chars[1], cell * 0.58, cell * 0.58, size * 0.38); put(chars[2], cell * 0.58, cell * 1.45, size * 0.38); }
    else { put(chars[0], cell * 1.44, cell * 0.58, size * 0.38); put(chars[1], cell * 1.44, cell * 1.45, size * 0.38); put(chars[2], cell * 0.58, cell * 0.58, size * 0.38); put(chars[3], cell * 0.58, cell * 1.45, size * 0.38); }
    o.restore();
  };

  /* Write Chinese text in vertical columns, right to left, the way inscriptions are written:
   * punctuation is left out and becomes a short pause. Returns the x of the next free column. */
  HS.verticalText = function (g, lines, xRight, yTop, size, lineGap = 1.35, charGap = 1.12) {
    let x = xRight;
    for (const line of lines) {
      let y = yTop;
      for (const ch of Array.from(line)) {
        if (/[，。、；：！？,.!?;:“”"'‘’（）()《》\s]/.test(ch)) { y += size * 0.35; continue; }
        g.fillText(ch, x, y);
        y += size * charGap;
      }
      x -= size * lineGap;
    }
    return x;
  };
})();

</script>
<script>
/* 护生之约 · the album cover */
(function () {
  'use strict';
  const { h } = HS;

  /* An evening under the willow: a child points out the new moon to the cat. */
  HS.coverArt = function () {
    const A = Art, C = A.C;
    let s = '';
    s += A.hills(560, 21, { color: C.indigo, op: 0.13, h: 120 });
    s += A.hills(590, 34, { color: C.green, op: 0.12, h: 60 });
    s += A.moon(470, 160, 34, { glow: true });
    s += A.blob(560, 660, 600, 70, C.ochre, 0.2);
    s += A.willow(170, 670, 1.38, 11);
    // a low stone step
    s += A.shape('M470 612C520 598 640 598 700 610L706 640C640 650 520 650 466 640Z', '#b9b2a2', 0.55, { filter: 'hs-wash' });
    s += A.stroke([[468, 612], [540, 601], [640, 600], [702, 610]], 3.2, { head: 0.8 });
    s += A.line([[466, 640], [600, 648], [706, 640]], 1.3, { op: 0.6 });
    s += A.kid({ x: 586, y: 612, s: 1.25, flip: true, legs: 'sit', jacket: C.rouge, arms: { l: [[-16, -62], [-4, -50]], r: [[26, -86], [40, -112]] } });
    s += A.place(A.cat(), { x: 676, y: 604, s: 0.62 });
    // fireflies
    A.seed(5);
    for (let i = 0; i < 9; i++) {
      const x = A.rnd(250, 460), y = A.rnd(360, 560);

    s += A.grass(430, 620, 1.3, 3) + A.grass(760, 632, 1.1, 4) + A.grass(820, 640, 0.9, 6);

  };

  HS.screens.title = {
    enter(root) {
      const t = HS.t;
      const P = HS.progress();
      const started = P.done > 0 || HS.state.prologue;
      const seal = h('div', { class: 'cover-seal', html: Art.sealSVG(HS.playerSealText(), { cls: 'seal-svg' }) });
      const input = h('input', { type: 'text', id: 'hs-name', maxlength: '12', autocomplete: 'off', placeholder: t('title.namePh'), value: HS.state.name || '' });
      input.addEventListener('input', () => {

      function begin() {

        h('button', { class: 'btn btn-seal', type: 'button', onclick: begin }, started ? t('title.continue') : t('title.start')),

      root.appendChild(h('section', { class: 'cover' },
        h('div', { class: 'cover-frame mount' },
          h('div', { class: 'painting', html: Art.svg(HS.coverArt(), 1000, 700, { label: t('app.name') }) }),
          h('div', { class: 'cover-ins' }, h('h1', { class: 'cover-title', lang: 'zh-CN' }, '护生之约'), seal)),
        h('div', { class: 'cover-body' },
          h('p', { class: 'cover-sub' }, t('app.sub')),
          h('p', { class: 'cover-lede' }, t('app.lede')),
          h('div', { class: 'cover-name' },
            h('label', { for: 'hs-name' }, t('title.nameLabel')),
            input,
            h('small', {}, t('title.nameHint'))),
          actions,
          h('div', { class: 'toolbar' },
            h('button', { class: 'btn btn-small', type: 'button', onclick: () => HS.go('teacher') }, t('title.teacher')),
            HS.langButton(),
            HS.soundButton()),
          h('p', { class: 'cover-credit' }, t('app.credit')))));
    },
  };
})();

<script>
/* 护生之约 · the album: every page of the game in one place */
(function () {
  'use strict';
  const { h } = HS;

  function studioThumb() {
    const A = Art, C = A.C;
    let s = A.blob(500, 380, 520, 60, C.ochre, 0.16);
    s += A.desk(250, 760, 300, 110);
    s += `<rect x="360" y="232" width="250" height="66" fill="${C.white}" stroke="${C.ink}" stroke-width="1.4" transform="rotate(-3 485 265)"/>`;
    s += A.stroke([[395, 272], [430, 258], [470, 266]], 4) + A.place(A.ant(false), { x: 520, y: 262, s: 1.6 }) + A.flower(575, 290, 1.1);
    s += A.brushPot(690, 300);
    s += A.place(A.cat(), { x: 190, y: 404, s: 0.7 });
    s += A.place(A.seal('护生'), { x: 820, y: 120, s: 0.55 });
    return s;
  }

  function quizThumb() {
    const A = Art, C = A.C;
    let s = A.blob(500, 215, 440, 150, C.mount || '#cad4ce', 0.25);
    s += `<rect x="300" y="70" width="400" height="290" fill="${C.white}" stroke="${C.ink}" stroke-width="1.6"/>`;
    s += `<rect x="314" y="84" width="372" height="262" fill="none" stroke="${C.seal}" stroke-width="1.4" stroke-opacity=".7"/>`;
    for (let i = 0; i < 5; i++) s += A.line([[350, 170 + i * 26], [650 - (i === 4 ? 140 : 0), 170 + i * 26]], 2.2, { op: 0.35 });
    s += A.stroke([[400, 130], [600, 128]], 7, { head: 0.9 });
    s += A.place(A.seal('护生'), { x: 585, y: 262, s: 0.62 });
    s += A.place(A.littleChick(), { x: 230, y: 330, s: 2.2 }) + A.place(A.littleChick(), { x: 780, y: 330, s: 2.2, flip: true });
    return s;
  }

  function card(o) {
    const art = h('div', { class: 'painting leaf-art', html: Art.svg(o.art, o.w || 1000, o.hgt || 625) });
    if (o.todo) art.appendChild(h('div', { class: 'leaf-draft' }, h('span', {}, HS.t('album.todo'))));
    const btn = h('button', { class: 'leaf-btn', type: 'button', onclick: () => { Sound.unlock(); Sound.page(); HS.go(o.go); } },
      h('div', { class: 'mount' }, art),
      h('div', { class: 'leaf-meta' },
        h('span', { class: 'leaf-no' }, o.no),
        h('span', { class: 'leaf-title' }, o.title),
        o.seals != null ? HS.sealsRow(o.seals) : o.badge ? h('span', { class: 'leaf-tag', style: 'grid-column:auto;color:var(--seal-deep)' }, o.badge) : h('span', {}),
        h('span', { class: 'leaf-tag' }, o.tag)));
    return h('li', { class: `leaf ${o.todo ? 'is-todo' : 'is-done'}${o.wide ? ' leaf-wide' : ''}`, id: 'leaf-' + o.go }, btn);
  }

  HS.screens.album = {
    enter(root, params) {
      const t = HS.t, P = HS.progress();
      const name = (HS.state.name || '').trim();
      const head = h('header', { class: 'album-head' },
        h('div', {},
          h('h1', { class: 'album-title' }, name ? t('album.titleNamed', { name }) : t('album.title')),
          h('p', { class: 'album-progress' }, t('album.progress', { done: P.done, seals: P.seals }))),
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => HS.go('title') }, '‹ ' + t('ui.cover')),
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => HS.go('teacher') }, t('title.teacher')),
          HS.langButton(),
          HS.soundButton()));

      const intro = h('ul', { class: 'album-intro', style: 'margin:0;padding:0' }, h('li', { class: 'leaf leaf-intro is-done', id: 'leaf-prologue' },
        h('button', { class: 'leaf-btn', type: 'button', onclick: () => { Sound.unlock(); Sound.page(); HS.go('prologue'); } },
          h('div', { class: 'mount' }, h('div', { class: 'painting leaf-art', html: Art.svg(HS.prologueThumb ? HS.prologueThumb() : '', 1000, 625) })),
          h('div', { class: 'leaf-meta' },
            h('span', { class: 'leaf-no' }, t('album.prologue').split(' · ')[0] + (HS.state.prologue ? ' · ' + t('album.read') : '')),
            h('span', { class: 'leaf-title' }, t('pro.title')),
            h('span', { class: 'leaf-desc' }, HS.en() ? `${t('album.prologueDesc')}: ${t('pro.p4.gloss')}` : `${t('album.prologueDesc')}：“${HS.zh('pro.p4.quote')}”`)))));
      const grid = h('ol', { class: 'album-grid' });
      for (const def of HS.chapters) {
        const p = HS.state.pages[def.id];
        const done = !!(p && p.done);
        grid.appendChild(card({
          go: def.id, no: HS.pageNo(def.no), title: t(def.key + '.title'),
          tag: `${t(def.key + '.animal')} · ${t(def.key + '.season')}`,
          art: def.painting(), todo: !done, seals: done ? p.seals || 1 : null,
        }));
      }

      const extra = h('ol', { class: 'album-grid album-extra' },
        card({ go: 'studio', no: t('album.studio').split(' · ')[0], title: t('studio.title'), tag: t('album.studioDesc'), art: studioThumb(), hgt: 430, wide: true }),
        card({ go: 'quiz', no: '', title: t('album.quiz'), tag: t('album.quizDesc'), art: quizThumb(), hgt: 430, wide: true, badge: HS.state.quiz.passed ? t('album.quizPassed') : null }));

      const parts = [head];
      if (P.done === P.total) {
        parts.push(h('div', { class: 'finish-banner', role: 'status' }, h('span', { html: Art.sealSVG(HS.playerSealText(), { cls: 'seal-svg' }) }), h('p', {}, t('album.finish'))));
      } else {
        parts.push(h('p', { class: 'album-hint' }, t('album.hint')));
      }
      parts.push(intro, grid, extra);
      root.appendChild(h('section', { class: 'album' }, ...parts));

      if (params.highlight) {
        const el = document.getElementById('leaf-' + params.highlight);
        if (el) {
          el.classList.add('is-new');
          requestAnimationFrame(() => el.scrollIntoView({ block: 'center', behavior: HS.reducedMotion() ? 'auto' : 'smooth' }));
          const b = el.querySelector('button');
          if (b) b.focus({ preventScroll: true });
        }
      }
    },
  };
})();

</script>
<script>
/* 护生之约 · prologue: the story of a promise, as a picture book */
(function () {
  'use strict';
  const { h } = HS;
  const A = Art, C = Art.C;

  const floor = (y = 600) => A.blob(500, y + 40, 520, 60, C.ochre, 0.16) + A.line([[40, y], [960, y + 4]], 1.3, { op: 0.45 });

  function artStudent() {
    let s = floor();
    // a window with willow twigs outside
    s += `<rect x="110" y="110" width="230" height="210" fill="#e5ece6" fill-opacity=".7" stroke="${C.brown}" stroke-width="6" stroke-opacity=".75"/>`;
    s += A.line([[225, 110], [225, 320]], 2.4, { color: C.brown, op: 0.8 }) + A.line([[110, 215], [340, 215]], 2.4, { color: C.brown, op: 0.8 });
    A.seed(4);
    for (let i = 0; i < 6; i++) {
      const x = 130 + i * 36;
      s += A.line([[x, 112], [x + 6, 170], [x + 2, 230 + A.rnd(0, 60)]], 1.1, { op: 0.7 });
      for (let k = 0; k < 4; k++) s += A.stroke([[x + 4, 135 + k * 30], [x + 9, 141 + k * 30], [x + 10, 148 + k * 30]], 2.4, { color: C.leaf, op: 0.8, head: 0.7 });
    }
    // an organ: the teacher taught music too
    s += `<rect x="800" y="470" width="120" height="100" fill="#8d6b46" fill-opacity=".7" stroke="${C.ink}" stroke-width="1.6"/><rect x="806" y="500" width="108" height="12" fill="${C.white}" stroke="${C.ink}" stroke-width="1"/>`;
    for (let i = 0; i < 9; i++) s += `<rect x="${812 + i * 11}" y="500" width="5" height="7" fill="${C.ink}"/>`;
    s += A.stroke([[808, 570], [806, 600]], 5) + A.stroke([[912, 570], [914, 600]], 5);
    // easel with a still-life on it
    s += A.place(A.easel() + A.line([[-12, -64], [-14, -92], [0, -110], [14, -92], [12, -64]], 1.6) + A.line([[-12, -64], [12, -64]], 1.4), { x: 420, y: 600, s: 1.35 });
    s += A.adult({ x: 545, y: 600, flip: true, robe: '#7f97aa', arms: { l: [[-20, -112], [-16, -86]], r: [[34, -128], [62, -150]] } });
    s += A.adult({ x: 700, y: 602, flip: true, s: 1.04, robe: '#5b6570', arms: { l: [[-16, -110], [-4, -92]], r: [[16, -110], [4, -92]] } });
    return s;
  }

  function pine(x, y, s = 1) {
    let p = A.stroke([[0, 0], [4, -60], [-2, -130]], 7, { head: 0.9, tail: 0.3 });
    [[-100, 60], [-80, 70], [-58, 54], [-36, 40]].forEach(([yy, w], i) => {
      p += A.blob(i % 2 ? 10 : -8, yy, w, 12, C.leaf, 0.45);
      p += A.stroke([[-w * 0.8 + (i % 2 ? 14 : -10), yy + 4], [w * 0.8 + (i % 2 ? 14 : -10), yy]], 2.4, { color: C.ink, op: 0.8 });
    });
    return A.place(p, { x, y, s });
  }

  function artMonk() {
    let s = A.hills(430, 12, { color: C.indigo, op: 0.2, h: 170 }) + A.hills(470, 40, { color: C.green, op: 0.16, h: 90 });
    // temple roof on the hill
    s += A.place(`<path d="M-90 0C-60 -6-30-26 0-30 30-26 60-6 90 0L70 4-70 4Z" fill="#4b4d52" fill-opacity=".8"/>` + A.stroke([[-94, 2], [-40, -14], [0, -30], [40, -14], [94, 2]], 3) +
      `<rect x="-60" y="4" width="120" height="44" fill="#d9cfbd" stroke="${C.ink}" stroke-width="1.4"/><rect x="-14" y="16" width="28" height="32" fill="#8d6b46" fill-opacity=".7" stroke="${C.ink}" stroke-width="1.2"/>`, { x: 760, y: 250 });
    s += pine(640, 330, 0.9) + pine(900, 320, 0.8);
    // mountain path
    s += A.shape('M120 690C260 620 330 560 520 520 620 500 700 470 760 400L790 405C740 480 660 520 560 546 380 590 300 640 230 690Z', '#d8c8a6', 0.6, { filter: 'hs-wash' });
    s += A.adult({ x: 480, y: 552, s: 0.92, robe: '#8e8b82', hair: 'bald', arms: { l: [[-18, -112], [-10, -92]], r: [[18, -112], [10, -90]] } });
    A.seed(8);
    for (let i = 0; i < 5; i++) s += A.place(A.leafShape(i % 2 ? C.ochre : '#b8b35a'), { x: A.rnd(200, 900), y: A.rnd(120, 420), r: A.rnd(0, 180), s: 0.8 });
    s += A.grass(300, 650, 1.2, 5) + A.grass(620, 540, 1, 6);
    return s;
  }

  function artFifty() {
    let s = floor(612);
    s += A.line([[70, 110], [500, 138], [930, 112]], 1.6, { op: 0.8 });
    const hang = [
      [150, 116, -4, A.place(A.bird({ brow: false, color: C.ochre }), { x: 0, y: 70, s: 0.9 })],
      [320, 128, 2, A.place(A.fish('#d9765a'), { x: 0, y: 72, s: 0.9 })],
      [500, 136, -2, A.place(A.ant(true), { x: 0, y: 72, s: 2.2 })],
      [680, 128, 3, A.flower(0, 104, 1.6)],
      [850, 116, -3, A.place(A.butterfly(), { x: 0, y: 66, s: 1.3 })],
    ];
    hang.forEach(([x, y, r, inner]) => {
      s += A.place(`<rect x="-55" y="0" width="110" height="140" fill="${C.white}" stroke="${C.ink}" stroke-width="1.3"/>` + inner + `<rect x="-6" y="-8" width="12" height="16" fill="${C.bamboo}" stroke="${C.ink}" stroke-width="1"/>`, { x, y, r });
    });
    s += A.desk(420, 860, 470, 140);
    s += A.paperStack(560, 470, 8) + A.brushPot(800, 470);
    s += `<ellipse cx="690" cy="462" rx="30" ry="8" fill="${C.ink2}" stroke="${C.ink}" stroke-width="1.2"/>`;
    s += A.adult({ x: 330, y: 612, robe: '#7f97aa', arms: { l: [[-20, -112], [-14, -86]], r: [[40, -124], [100, -150]] } });
    s += A.line([[430, -0 + 462], [462, 440]], 2.2);
    return s;
  }

  function artLetter() {
    let s = A.blob(500, 380, 470, 250, C.ochre, 0.12);
    // letter paper with red columns
    s += A.place(
      `<rect x="0" y="0" width="330" height="420" fill="${C.white}" stroke="${C.ink}" stroke-width="1.4"/>` +
      Array.from({ length: 9 }, (_, i) => `<line x1="${30 + i * 34}" y1="24" x2="${30 + i * 34}" y2="396" stroke="${C.seal}" stroke-opacity=".45" stroke-width="1.2"/>`).join('') +
      Array.from({ length: 7 }, (_, i) => {
        A.seed(20 + i);
        let col = '';
        let y = 44;
        const x = 280 - i * 34 - 17;
        while (y < 340 - (i === 6 ? 150 : 0)) {
          const len = A.rnd(10, 22);
          col += A.stroke([[x - 5, y], [x + 4, y + len * 0.5], [x - 2, y + len]], 3.2, { head: 0.9, tail: 0.2 });
          y += len + A.rnd(8, 14);
        }
        return col;
      }).join(''),
      { x: 190, y: 120, r: -4 });
    // envelope
    s += A.place(`<rect x="0" y="0" width="180" height="300" fill="#efe3c6" stroke="${C.ink}" stroke-width="1.4"/><rect x="54" y="40" width="72" height="210" fill="none" stroke="${C.seal}" stroke-width="3" stroke-opacity=".75"/><rect x="128" y="12" width="40" height="46" fill="${C.indigo}" fill-opacity=".45" stroke="${C.ink}" stroke-width="1"/>` +
      A.stroke([[90, 70], [92, 110]], 5) + A.stroke([[88, 130], [92, 170]], 5) + A.stroke([[90, 190], [90, 222]], 5), { x: 620, y: 200, r: 6 });
    s += A.stroke([[260, 590], [520, 560]], 6, { color: C.brown, head: 1, tail: 0.8 }) + `<path d="M520 560L560 552 522 570Z" fill="${C.ink}"/>`;
    return s;
  }

  function artNight() {
    let s = `<rect x="0" y="0" width="1000" height="690" fill="${C.night}" fill-opacity=".16"/>`;
    s += `<rect x="90" y="90" width="260" height="230" fill="${C.night}" fill-opacity=".75" stroke="${C.brown}" stroke-width="7"/>`;
    s += A.moon(250, 170, 26, { glow: false, fill: '#f6ebbd' });
    s += A.line([[220, 90], [220, 320]], 2.4, { color: C.brown }) + A.line([[90, 205], [350, 205]], 2.4, { color: C.brown });
    s += floor(612);
    s += `<circle cx="640" cy="370" r="200" fill="url(#hs-glow)"/>`;
    s += A.desk(440, 900, 470, 140);
    s += A.place(A.lamp(), { x: 640, y: 470, s: 0.95 });
    s += A.paperStack(780, 470, 14) + A.paperStack(520, 470, 5);
    s += A.adult({ x: 360, y: 612, robe: '#6f8193', arms: { l: [[-18, -112], [-12, -86]], r: [[40, -120], [104, -146]] } });
    s += A.place(A.cat({ pose: 'sleep' }), { x: 700, y: 606, s: 0.8 });
    return s;
  }

  function artStacks() {
    let s = floor(600);
    const counts = [50, 60, 70, 80, 90, 100];
    const years = ['1929', '1940', '1949', '1960', '1965', '1973'];
    const cols = ['#6d8ea8', '#b58a52', '#7c9a68', '#6f6a8f', '#a45a4f', '#57606b'];
    counts.forEach((n, i) => {
      const x = 170 + i * 132, hgt = n * 3.4, top = 600 - hgt;
      let st = `<rect x="${x - 44}" y="${top}" width="88" height="${hgt}" fill="${C.white}" stroke="${C.ink}" stroke-width="1.4"/>`;
      for (let yy = top + 8; yy < 600; yy += 8) st += `<line x1="${x - 44}" y1="${yy}" x2="${x + 44}" y2="${yy}" stroke="${C.ink}" stroke-opacity=".18" stroke-width="1"/>`;
      st += `<rect x="${x - 44}" y="${top}" width="88" height="10" fill="${cols[i]}" fill-opacity=".85"/>`;
      st += `<text x="${x}" y="${top - 16}" text-anchor="middle" font-size="30" font-family="'Ma Shan Zheng','KaiTi',serif" fill="${C.ink}">${n}</text>`;
      st += `<text x="${x}" y="636" text-anchor="middle" font-size="22" fill="${C.ink2}" font-family="serif">${years[i]}</text>`;
      s += st;
    });
    s += A.place(A.cat(), { x: 930, y: 604, s: 0.55 });
    return s;
  }

  function artYourTurn() {
    let s = A.willowFringe(40, 960, 0, 9, { count: 10, min: 60, max: 170 });
    s += A.blob(500, 560, 480, 80, C.ochre, 0.16);
    s += A.desk(170, 830, 470, 150);
    // the blank album, open
    s += `<path d="M260 468L300 330 500 350 500 470Z" fill="${C.white}" stroke="${C.ink}" stroke-width="1.5"/><path d="M740 468L700 330 500 350 500 470Z" fill="${C.white}" stroke="${C.ink}" stroke-width="1.5"/>`;
    s += `<path d="M260 468L500 470 740 468" fill="none" stroke="${C.mount || '#a6b6ae'}" stroke-width="6"/>`;
    s += A.line([[500, 350], [500, 470]], 1.2, { op: 0.6 });
    s += A.line([[320, 380], [470, 392]], 1, { op: 0.2 }) + A.line([[312, 410], [468, 420]], 1, { op: 0.2 });
    s += A.stroke([[560, 458], [690, 430]], 5, { color: C.brown, head: 1, tail: 0.8 }) + `<path d="M690 430L716 424 692 438Z" fill="${C.ink}"/>`;
    s += A.place(A.cat(), { x: 880, y: 618, s: 0.9 });
    s += A.place(A.seal('护生'), { x: 640, y: 380, s: 0.45 });
    return s;
  }

  const PANELS = [
    { key: 'p1', art: artStudent },
    { key: 'p2', art: artMonk },
    { key: 'p3', art: artFifty },
    { key: 'p4', art: artLetter },
    { key: 'p5', art: artNight },
    { key: 'p6', art: artStacks },
    { key: 'p7', art: artYourTurn },
  ];
  const VOL_COLORS = ['#6d8ea8', '#b58a52', '#7c9a68', '#6f6a8f', '#a45a4f', '#57606b'];

  HS.prologueThumb = () => `<g transform="scale(1 ${625 / 690})">${artLetter()}</g>`;

  function shelf() {
    const vols = HS.t('pro.vol');
    const info = h('div', { class: 'vol-info', 'aria-live': 'polite' }, HS.t('pro.shelfHint'));
    const row = h('div', { class: 'shelf', role: 'group', 'aria-label': HS.t('pro.p6.t') });
    vols.forEach((v, i) => {
      const b = h('button', { class: 'vol', type: 'button', 'aria-pressed': 'false', style: `--i:${i};--c:${VOL_COLORS[i]}` }, HS.en() ? v.year : v.n);
      b.addEventListener('click', () => {
        row.querySelectorAll('.vol').forEach((x) => x.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        Sound.pluck ? null : null;
        Sound.soft();
        info.innerHTML = '';
        info.append(h('b', {}, `${v.n} · ${v.year}`), ' ', h('span', {}, `${v.count} · ${v.by}`), v.note ? h('div', { class: 'muted' }, v.note) : null);
      });
      row.appendChild(b);
    });
    return h('div', { style: 'display:grid;gap:.6rem' }, row, info);
  }

  HS.screens.prologue = {
    enter(root) {
      const t = HS.t;
      let i = 0;
      const pageBox = h('div');
      const dots = h('div', { class: 'dots', 'aria-hidden': 'true' }, PANELS.map(() => h('span')));
      const prev = h('button', { class: 'btn', type: 'button' }, '‹ ' + t('ui.prev'));
      const next = h('button', { class: 'btn btn-seal', type: 'button' }, t('ui.next') + ' ›');
      const status = h('span', { class: 'sr-only', 'aria-live': 'polite' });

      function finish() {
        HS.state.prologue = true;
        HS.save();
        Sound.page();
        HS.go('album');
      }

      function render() {
        const p = PANELS[i];
        const text = h('div', { class: 'book-text' },
          h('p', { class: 'eyebrow', style: 'color:var(--seal);letter-spacing:.1em;font-size:.9rem' }, `${t('album.prologue')} · ${i + 1} / ${PANELS.length}`),
          h('h2', {}, t(`pro.${p.key}.t`)),
          h('p', {}, t(`pro.${p.key}`)));
        if (p.key === 'p4') {
          text.append(h('p', { class: 'big-quote', lang: 'zh-CN' }, HS.zh('pro.p4.quote')), h('p', { class: 'muted' }, t('pro.p4.gloss')));
        }
        if (p.key === 'p6') text.append(shelf());
        if (p.key === 'p7') {
          text.append(h('p', { class: 'big-quote', lang: 'zh-CN', style: 'font-size:clamp(1.6rem,3.6vw,2.3rem)' }, '护生者，护心也。'));
          text.append(h('div', { class: 'card-row' }, h('div', { class: 'guide-cat', html: HS.catSVG() }), h('p', { class: 'reply' }, h('span', { class: 'who' }, t('ui.catName') + (HS.en() ? ':' : '：')), t('pro.p7.cat'))));
        }
        pageBox.innerHTML = '';
        pageBox.appendChild(h('div', { class: 'book-page' },
          h('div', { class: 'mount' }, h('div', { class: 'painting', html: A.svg(p.art(), 1000, 690, { label: t(`pro.${p.key}.t`) }) })),
          text));
        [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
        prev.disabled = i === 0;
        next.textContent = i === PANELS.length - 1 ? t('pro.open') : t('ui.next') + ' ›';
        status.textContent = `${i + 1} / ${PANELS.length}`;
        if (p.key === 'p4') Sound.promise();
      }

      prev.addEventListener('click', () => { if (i > 0) { i--; Sound.page(); render(); } });
      next.addEventListener('click', () => {
        if (i < PANELS.length - 1) { i++; Sound.page(); render(); window.scrollTo({ top: 0 }); } else finish();
      });
      const onKey = (e) => {
        if (e.target && /input|textarea/i.test(e.target.tagName)) return;
        if (e.key === 'ArrowRight') next.click();
        if (e.key === 'ArrowLeft') prev.click();
      };
      document.addEventListener('keydown', onKey);

      root.appendChild(h('section', { class: 'book' },
        h('div', { class: 'book-head' },
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => HS.go(HS.state.prologue ? 'album' : 'title') }, '‹ ' + (HS.state.prologue ? t('ui.album') : t('ui.cover'))),
          h('h1', { style: 'font-size:clamp(1.6rem,3vw,2.1rem)' }, t('album.prologue')),
          h('button', { class: 'btn btn-small', type: 'button', onclick: finish }, t('ch.skipIntro'))),
        pageBox,
        h('div', { class: 'book-nav' }, prev, dots, next, status)));
      render();
      return () => document.removeEventListener('keydown', onKey);
    },
  };
})();

</script>
<script>
/* 护生之约 · 第一页 · 扫地 (Sweeping Gently)
 * Sweep the willow leaves off the courtyard path without disturbing
 * the line of ants carrying rice home before the rain. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const TRAIL = [[70, 420], [210, 386], [380, 440], [560, 394], [730, 446], [880, 420]];
  const LEAF_COLORS = ['#c9a45f', '#b8b35a', '#a8743f', '#c79a55', '#9fae5c'];

  function courtyard(o = {}) {
    let s = `<rect width="1000" height="625" fill="#f4eee1"/>`;
    // whitewashed wall with a moon gate
    s += `<rect x="-10" y="84" width="1020" height="176" fill="#f8f4ec"/>`;
    s += `<circle cx="240" cy="178" r="96" fill="#dfe6d8"/>`;
    A.seed(12);
    for (let i = 0; i < 7; i++) {
      const x = 170 + i * 22 + A.rnd(-4, 4);
      s += A.line([[x, 270], [x + A.rnd(-6, 6), 120]], 2, { color: C.leaf, op: 0.7 });
      s += A.stroke([[x, 150 + i * 9], [x + 16, 142 + i * 9], [x + 26, 146 + i * 9]], 3, { color: C.leaf, op: 0.75, head: 0.8 });
    }
    s += `<circle cx="240" cy="178" r="96" fill="none" stroke="${C.ink}" stroke-width="3"/><circle cx="240" cy="178" r="104" fill="none" stroke="${C.ink}" stroke-width="1.2" stroke-opacity=".5"/>`;
    s += A.wallTop(-20, 1020, 70, 8);
    s += A.line([[-10, 260], [1010, 262]], 1.6, { op: 0.6 });
    // ground and flagstone path
    s += A.shape('M-20 266L1020 266 1020 640-20 640Z', C.ochre, 0.16, { filter: 'hs-wash' });
    A.seed(21);
    [[342, 420], [424, 502]].forEach(([y0, y1], row) => {
      let x = row ? -60 : -20;
      while (x < 1020) {
        const w = A.rnd(100, 160);
        const pts = [[x + 8, y0 + A.rnd(0, 7)], [x + w * 0.5, y0 + A.rnd(-3, 4)], [x + w - 8, y0 + A.rnd(0, 7)], [x + w - 2, (y0 + y1) / 2 + A.rnd(-4, 4)], [x + w - 8, y1 - A.rnd(0, 7)], [x + w * 0.5, y1 + A.rnd(-3, 3)], [x + 8, y1 - A.rnd(0, 7)], [x + 2, (y0 + y1) / 2 + A.rnd(-4, 4)]];
        s += `<path d="${A.smoothD(pts, true)}" fill="#d9d2c3" fill-opacity=".55" stroke="${C.ink}" stroke-width="1.1" stroke-opacity=".45"/>`;
        x += w + A.rnd(6, 12);
      }
    });
    // the ants' nest and the rice they are carrying
    s += A.blob(885, 424, 30, 12, C.brown, 0.35, { filter: false }) + `<ellipse cx="886" cy="422" rx="7" ry="4" fill="${C.ink}"/>`;
    s += `<path d="M52 422C50 410 66 404 78 410 88 414 86 428 74 430 62 432 54 430 52 422Z" fill="#fbf6e6" stroke="${C.ink2}" stroke-width="1.2"/>`;
    s += A.grass(30, 560, 1.2, 2) + A.grass(640, 590, 1, 3) + A.grass(960, 560, 1.2, 4) + A.flower(90, 300, 1, C.rouge) + A.flower(120, 306, 0.8, C.yellow);
    if (!o.noWillow) s += A.willow(890, 330, 0.95, 11, { long: 230 });
    return s;
  }

  function painting() {
    let s = courtyard();
    A.seed(3);
    const S = A.spline(TRAIL, 10);
    for (let i = 8; i < S.length - 4; i += 7) {
      const a = Math.atan2(S[i + 1][1] - S[i][1], S[i + 1][0] - S[i][0]) * 180 / Math.PI;
      s += A.place(A.ant(i % 2 === 0), { x: S[i][0], y: S[i][1], r: a, s: 1.2 });
    }
    s += A.kid({ x: 470, y: 560, s: 1.05, legs: 'crouch', jacket: C.indigo, hair: 'girl', arms: { l: [[-14, -60], [4, -44]], r: [[18, -60], [12, -44]] } });
    s += A.place(A.broom(), { x: 620, y: 300, s: 0.7, r: 12 });
    s += A.swallow(520, 40, 0.9, -8) + A.swallow(600, 28, 0.7, 6);
    return s;
  }

  function pov() {
    let s = `<rect width="1000" height="420" fill="#f1ebdd"/>`;
    s += A.blob(500, 380, 560, 70, C.ochre, 0.25);
    A.seed(9);
    for (let i = 0; i < 24; i++) {
      const x = 170 + i * 28 + A.rnd(-6, 6), top = A.rnd(-40, 30), bottom = 150 + A.rnd(0, 120);
      s += A.stroke([[x, top], [x + A.rnd(-10, 10), bottom * 0.6], [x + A.rnd(-30, 30), bottom]], A.rnd(6, 12), { color: i % 3 ? '#8f7442' : C.ink, op: 0.8, head: 1, tail: 0.2 });
    }
    s += `<path d="M150-10L850-10 820 60 180 60Z" fill="${C.bamboo}" fill-opacity=".35"/>`;
    for (let i = 0; i < 9; i++) s += A.grass(60 + i * 110 + A.rnd(-20, 20), 400, 3, i + 2);
    s += A.place(A.ant(true), { x: 520, y: 368, s: 3.2, r: -4 });
    return s;
  }

  HS.chapter({
    id: 'ants', key: 'ants', no: 1,
    painting, pov,
    play(ctx) {
      return new Promise((resolve) => {
        const t = ctx.t;
        ctx.add('bg', courtyard());
        const leafLayer = ctx.layer('leaves');
        const antLayer = ctx.layer('ants');
        const dim = ctx.add('sky', `<rect width="1000" height="625" fill="#5d6a78" opacity="0"/>`).firstChild;
        const rain = ctx.add('rain', A.rainDrops(1000, 625, 90, 4), { opacity: '0' });
        const broom = ctx.add('tool', A.broom(), { opacity: '0', 'pointer-events': 'none' });

        // trail geometry
        const S = A.spline(TRAIL, 16);
        const cum = [0];
        for (let i = 1; i < S.length; i++) cum.push(cum[i - 1] + Math.hypot(S[i][0] - S[i - 1][0], S[i][1] - S[i - 1][1]));
        const L = cum[cum.length - 1];
        function at(s) {
          s = HS.clamp(s, 0, L);
          let i = 1;
          while (i < cum.length - 1 && cum[i] < s) i++;
          const f = (s - cum[i - 1]) / (cum[i] - cum[i - 1] || 1);
          const x = HS.lerp(S[i - 1][0], S[i][0], f), y = HS.lerp(S[i - 1][1], S[i][1], f);
          const ang = Math.atan2(S[i][1] - S[i - 1][1], S[i][0] - S[i - 1][0]);
          return { x, y, ang };
        }

        // ants: most carry rice to the nest, a few walk back for more
        const ants = [];
        const nOut = ctx.easy ? 8 : 10, nBack = ctx.easy ? 3 : 4;
        for (let i = 0; i < nOut + nBack; i++) {
          const back = i >= nOut;
          const el = HS.sprite(antLayer, A.ant(!back));
          ants.push({
            el, back, crumb: el.querySelector('.crumb'),
            s: back ? ((i - nOut) + 0.5) * (L / nBack) : i * (L / nOut),
            speed: (back ? 34 : 26) * (0.9 + Math.random() * 0.25),
            off: back ? 12 : 0, scare: 0, cool: 0, phase: Math.random() * 6,
          });
        }

        // leaves on the path, several close to the ants
        const leaves = [];
        const total = ctx.easy ? 10 : 14;
        let tries = 0;
        while (leaves.length < total && tries++ < 500) {
          const nearTrail = leaves.length < total * 0.45;
          let x, y;
          if (nearTrail) {
            const p = at(Math.random() * L * 0.9 + L * 0.05);
            const side = Math.random() < 0.5 ? -1 : 1;
            const d = 26 + Math.random() * 20;
            x = p.x - Math.sin(p.ang) * d * side;
            y = p.y + Math.cos(p.ang) * d * side;
          } else {
            x = 60 + Math.random() * 880;
            y = 335 + Math.random() * 175;
          }
          if (leaves.some((l) => HS.dist(l.x, l.y, x, y) < 48)) continue;
          if (x > 840 && y < 450) continue;
          const r = Math.random() * 360;
          const el = HS.sprite(leafLayer, A.leafShape(LEAF_COLORS[leaves.length % LEAF_COLORS.length]), { class: 'hit' });
          HS.setPos(el, x, y, r, 1.25);
          leaves.push({ el, x, y, r, gone: false, vx: 0, vy: 0, life: 0 });
        }

        let swept = 0, startled = 0, rainOn = false, finished = false;
        const stat = () => ctx.stat(t('ants.stat', { a: swept, b: total, c: startled }));
        stat();

        function removeLeaf(l, vx, vy, gentle) {
          if (l.gone) return;
          l.gone = true;
          l.vx = vx; l.vy = vy; l.life = gentle ? 0.9 : 0.55; l.gentle = gentle;
          swept++;
          if (gentle) Sound.soft(); else Sound.swish();
          stat();
          if (!rainOn && swept >= Math.ceil(total / 2)) {
            rainOn = true;
            ctx.say(t('ants.rain'), 4200);
          }
          if (swept === total) finish();
        }

        function startle(a) {
          if (a.cool > 0) return;
          a.scare = 1.1; a.cool = 1.4;
          startled++;
          stat();
          Sound.oops();
          const p = at(a.s);
          ctx.float(p.x, p.y - 18, '!', C.seal, 34);
          if (startled === 1 || startled % 4 === 0) ctx.say(t('ants.oops'), 2600);
          if (a.crumb && !a.back && a.crumb.style.display !== 'none') {
            a.crumb.style.display = 'none';
            const c = ctx.add('fx', `<circle cx="${p.x.toFixed(0)}" cy="${(p.y + 3).toFixed(0)}" r="3" fill="#fbf6e6" stroke="#b8a079" stroke-width=".7"/>`);
            ctx.after(2500, () => c.remove());
          }
        }

        // pointer: drag to sweep, tap to pick up a leaf gently
        const svg = ctx.svg;
        let down = null, last = null, dragging = false;
        const R_LEAF = 40, R_ANT = 24;
        function showBroom(p, tilt) {
          broom.setAttribute('opacity', '1');
          HS.setPos(broom, p.x, p.y + 8, tilt || 0, 0.78);
        }
        function sweepAlong(p0, p1) {
          const dx = p1.x - p0.x, dy = p1.y - p0.y, d = Math.hypot(dx, dy);
          const steps = Math.max(1, Math.ceil(d / 8));
          const ux = d ? dx / d : 0, uy = d ? dy / d : 0;
          for (let k = 1; k <= steps; k++) {
            const qx = p0.x + (dx * k) / steps, qy = p0.y + (dy * k) / steps;
            for (const l of leaves) {
              if (l.gone) continue;
              const ex = (l.x - qx) / R_LEAF, ey = (l.y - qy) / (R_LEAF * 0.6);
              if (ex * ex + ey * ey < 1) removeLeaf(l, ux * 520 + (Math.random() - 0.5) * 80, uy * 520 - 60, false);
            }
            for (const a of ants) {
              const p = at(a.s);
              const ax = p.x - Math.sin(p.ang) * a.off, ay = p.y + Math.cos(p.ang) * a.off;
              if (HS.dist(ax, ay, qx, qy) < R_ANT) startle(a);
            }
          }
        }
        ctx.on(svg, 'pointerdown', (e) => {
          if (finished) return;
          e.preventDefault();
          try { svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
          const p = ctx.point(e);
          down = { x: p.x, y: p.y, time: performance.now() };
          last = p;
          dragging = false;
          showBroom(p, 0);
        });
        ctx.on(svg, 'pointermove', (e) => {
          const p = ctx.point(e);
          if (!down) { if (e.pointerType === 'mouse' && !finished) showBroom(p, 0); return; }
          if (!dragging && HS.dist(p.x, p.y, down.x, down.y) > 7) { dragging = true; svg.classList.add('is-dragging'); }
          if (dragging && !finished) {
            sweepAlong(last, p);
            showBroom(p, HS.clamp((p.x - last.x) * 1.5, -22, 22));
          }
          last = p;
        });
        const up = (e) => {
          if (!down) return;
          const p = ctx.point(e);
          if (!dragging && !finished) {
            const leaf = leaves.filter((l) => !l.gone).sort((a, b) => HS.dist(a.x, a.y, p.x, p.y) - HS.dist(b.x, b.y, p.x, p.y))[0];
            if (leaf && HS.dist(leaf.x, leaf.y, p.x, p.y) < 30 * ctx.reach) {
              removeLeaf(leaf, 0, -160, true);
            } else {
              const ant = ants.find((a) => { const q = at(a.s); return HS.dist(q.x, q.y, p.x, p.y) < 18; });
              if (ant) { ctx.say(t('ants.poke'), 2400); Sound.soft(); }
            }
          }
          down = null;
          dragging = false;
          svg.classList.remove('is-dragging');
          if (e.pointerType !== 'mouse') broom.setAttribute('opacity', '0');
        };
        ctx.on(svg, 'pointerup', up);
        ctx.on(svg, 'pointercancel', up);
        ctx.on(svg, 'pointerleave', (e) => { if (e.pointerType === 'mouse' && !down) broom.setAttribute('opacity', '0'); });

        let dimLevel = 0, rainLevel = 0, homeTimer = 0;
        const stop = ctx.loop((dt, now) => {
          // ants walk the trail
          for (const a of ants) {
            let v = a.speed * ctx.speed * (rainOn ? 1.35 : 1) * (a.scare > 0 ? 2.6 : 1);
            a.cool = Math.max(0, a.cool - dt);
            a.scare = Math.max(0, a.scare - dt);
            a.s += (a.back ? -v : v) * dt;
            if (!finished) {
              if (!a.back && a.s > L) { a.s -= L; if (a.crumb) a.crumb.style.display = ''; }
              if (a.back && a.s < 0) a.s += L;
            }
            const p = at(a.s);
            const jit = a.scare > 0 ? (Math.random() - 0.5) * 4 : 0;
            const wob = Math.sin(now * 9 + a.phase) * 5;
            const x = p.x - Math.sin(p.ang) * a.off + jit, y = p.y + Math.cos(p.ang) * a.off + jit;
            HS.setPos(a.el, x, y, (p.ang * 180) / Math.PI + (a.back ? 180 : 0) + wob, 1.25);
            const edge = Math.min(a.s, L - a.s);
            a.el.setAttribute('opacity', finished && (a.s >= L || a.s <= 0) ? '0' : HS.clamp(edge / 18, 0, 1).toFixed(2));
          }
          // leaves in flight
          for (const l of leaves) {
            if (!l.gone || l.life <= 0) continue;
            l.life -= dt;
            if (l.gentle) { l.y += l.vy * dt; l.r += 90 * dt; }
            else { l.x += l.vx * dt; l.y += l.vy * dt; l.vy += 500 * dt; l.r += 540 * dt; }
            HS.setPos(l.el, l.x, l.y, l.r, 1.25);
            l.el.setAttribute('opacity', HS.clamp(l.life / 0.5, 0, 1).toFixed(2));
            if (l.life <= 0) l.el.remove();
          }
          // rain clouds gather after half the leaves are gone
          if (rainOn) {
            dimLevel = Math.min(0.14, dimLevel + dt * 0.05);
            dim.setAttribute('opacity', dimLevel.toFixed(3));
          }
          if (finished) {
            rainLevel = Math.min(1, rainLevel + dt * 0.8);
            rain.setAttribute('opacity', rainLevel.toFixed(2));
            rain.setAttribute('transform', `translate(${(-(now * 40) % 30).toFixed(1)} ${((now * 260) % 60).toFixed(1)})`);
            homeTimer += dt;
            if (homeTimer > 3.2 && !resolved) done();
          }
        });

        let resolved = false;
        function finish() {
          finished = true;
          broom.setAttribute('opacity', '0');
          // every ant heads for the nest before the rain
          ants.forEach((a) => { a.back = false; a.off = 0; a.speed = 70 + Math.random() * 30; });
        }
        function done() {
          resolved = true;
          ctx.say(t('ants.win'), 4000);
          Sound.win();
          ctx.after(1600, () => {
            stop();
            resolve({ seals: startled <= 1 ? 3 : startled <= 4 ? 2 : 1 });
          });
        }
      });
    },
  });
})();

</script>
<script>
/* 护生之约 · 第二页 · 清池 (A Clear Pond)
 * Scoop the rubbish out of the pond without frightening the fish,
 * and free the fish caught in an old fishing line. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const POND = { cx: 500, cy: 345, rx: 440, ry: 205 };
  const BASKET = { x: 905, y: 588 };
  const FISH_COLORS = ['#8f9c8a', '#8f9c8a', '#d9765a', '#9aa493', '#e0a24e', '#8f9c8a'];

  const TRASH = {
    bottle: () => `<g transform="rotate(72)"><path d="M-7-14L-7 18Q-7 22-3 22L3 22Q7 22 7 18L7-14Q7-18 4-21L4-26-4-26-4-21Q-7-18-7-14Z" fill="#e3ecef" fill-opacity=".9" stroke="${C.ink}" stroke-width="1.3"/><rect x="-4.5" y="-31" width="9" height="5" fill="#5d8fb8" stroke="${C.ink}" stroke-width=".8"/><rect x="-7" y="-4" width="14" height="9" fill="#d86a5c" fill-opacity=".8"/></g>`,
    bag: () => `<path d="M-21-2C-23 11-12 21 0 21 12 21 23 11 21-2L16-16 9-16 9-6-9-6-9-16-16-16Z" fill="#f7f7f3" fill-opacity=".85" stroke="${C.ink}" stroke-width="1.2" stroke-linejoin="round"/><path d="M-12 4C-8 8-4 6 0 10M6 2C9 6 12 6 14 10" stroke="${C.ink}" stroke-width=".8" fill="none" stroke-opacity=".5"/>`,
    can: () => `<g transform="rotate(-20)"><rect x="-9" y="-15" width="18" height="30" rx="2" fill="#c85a4e" fill-opacity=".9" stroke="${C.ink}" stroke-width="1.2"/><ellipse cx="0" cy="-15" rx="9" ry="3" fill="#d9d4cc" stroke="${C.ink}" stroke-width="1"/><path d="M-9-2L9-2" stroke="#fff" stroke-width="3" stroke-opacity=".7"/></g>`,
    wrapper: () => `<path d="M-17-9L17-9 20-6 17-3 20 0 17 3 20 6 17 9-17 9-20 6-17 3-20 0-17-3-20-6Z" fill="#e8c35a" fill-opacity=".92" stroke="${C.ink}" stroke-width="1.1" stroke-linejoin="round"/><path d="M-10-9L-10 9M10-9L10 9" stroke="#c0503f" stroke-width="3" stroke-opacity=".7"/>`,
    box: () => `<path d="M-20-8L10-14 22-4-8 4Z" fill="#fbfbf7" stroke="${C.ink}" stroke-width="1.1" stroke-linejoin="round"/><path d="M-20-8L-20 2-8 14-8 4ZM-8 4L22-4 22 6-8 14Z" fill="#ecebe4" stroke="${C.ink}" stroke-width="1.1" stroke-linejoin="round"/>`,
  };
  const TRASH_KINDS = ['bag', 'bottle', 'can', 'wrapper', 'box'];

  function pondShape() {
    return 'M60 330C50 220 160 150 300 140 420 132 560 150 690 140 830 130 950 190 950 300 955 420 900 520 760 545 620 570 450 560 300 552 150 545 70 460 60 330Z';
  }

  function lotusLeaf(x, y, rx, ry, r = 0) {
    const a = 0.2;
    const d = `M0 0L${(rx * Math.cos(-a)).toFixed(1)} ${(ry * Math.sin(-a)).toFixed(1)}A${rx} ${ry} 0 1 0 ${(rx * Math.cos(a)).toFixed(1)} ${(ry * Math.sin(a)).toFixed(1)}Z`;
    let s = `<path d="${d}" fill="#7fa36a" fill-opacity=".62" stroke="${C.ink}" stroke-width="1.2"/>`;
    for (let i = 1; i < 8; i++) {
      const ang = a + (i / 8) * (Math.PI * 2 - 2 * a);
      s += `<path d="M0 0L${(rx * 0.85 * Math.cos(ang)).toFixed(1)} ${(ry * 0.85 * Math.sin(ang)).toFixed(1)}" stroke="${C.ink}" stroke-width=".7" stroke-opacity=".4"/>`;
    }
    return A.place(s, { x, y, r });
  }

  function lotusBud(x, y, s = 1) {
    return A.place(A.stroke([[0, 0], [2, -30], [0, -62]], 3.4, { color: C.leaf, head: 1, tail: 0.8 }) +
      `<path d="M0-94C12-82 13-66 0-60-13-66-12-82 0-94Z" fill="#e8a5a0" fill-opacity=".85" stroke="${C.ink}" stroke-width="1.2"/><path d="M0-92C4-80 4-70 0-61" stroke="${C.ink}" stroke-width=".8" fill="none" stroke-opacity=".6"/>`, { x, y, s });
  }

  function reeds(x, y, s = 1, sd = 1) {
    A.seed(sd);
    let r = '';
    for (let i = 0; i < 6; i++) {
      const dx = A.rnd(-18, 18), h = A.rnd(90, 150), lean = A.rnd(-20, 20);
      r += A.stroke([[dx, 0], [dx + lean * 0.4, -h * 0.5], [dx + lean, -h]], 2.6, { color: '#6d7f4c', head: 1, tail: 0.1 });
      if (i % 2) r += `<ellipse cx="${(dx + lean).toFixed(0)}" cy="${(-h - 8).toFixed(0)}" rx="3.2" ry="10" fill="${C.brown}" transform="rotate(${lean.toFixed(0)} ${(dx + lean).toFixed(0)} ${(-h - 8).toFixed(0)})"/>`;
    }
    return A.place(r, { x, y, s });
  }

  function basket() {
    let b = `<path d="M-40-22L40-22 32 12-32 12Z" fill="#b89b62" fill-opacity=".85" stroke="${C.ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
