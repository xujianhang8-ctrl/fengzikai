      bar.querySelector('.hud-no').textContent = '';
      const main = h('div', { class: 'quiz' });
      root.appendChild(h('section', {}, bar, main));

      function showCert() {
        main.querySelectorAll('.btn').forEach((b) => { b.disabled = true; });
        certificate().then((cv) => {
          main.querySelectorAll('.btn').forEach((b) => { b.disabled = false; });
          HS.showPicture(cv, `${t('cert.title')}.png`, { title: t('cert.title'), alt: t('cert.title') });
        });
      }

      function intro() {
        stat.textContent = '';
        main.innerHTML = '';
        main.appendChild(h('div', { class: 'quiz-card' },
          h('div', { class: 'card-row' }, h('div', { class: 'guide-cat', html: HS.catSVG() }), h('p', {}, t('quiz.intro', { n: N, pass: PASS }))),
          h('div', { class: 'card-actions', style: 'justify-content:flex-start' },
            h('button', { class: 'btn btn-seal', type: 'button', onclick: () => { Sound.unlock(); Sound.page(); run(); } }, t('quiz.go')),
            HS.state.quiz.passed ? h('button', { class: 'btn', type: 'button', onclick: showCert }, t('quiz.certBtn')) : null)));
      }

      function run() {
        const qs = HS.shuffle(window.QUIZ).slice(0, N).map((q) => q[en ? 'en' : 'zh']);
        let i = 0, score = 0;
        function ask() {
          const q = qs[i];
          const right = q.a[0];
          stat.textContent = t('quiz.q', { a: i + 1, b: N });
          main.innerHTML = '';
          const list = h('div', { class: 'choice-list' });
          const after = h('div', { 'aria-live': 'polite', style: 'display:grid;gap:.7rem' });
          HS.shuffle(q.a).forEach((label) => {
            const b = h('button', { class: 'choice', type: 'button' }, label);
            b.addEventListener('click', () => {
              list.querySelectorAll('button').forEach((x) => {
                x.disabled = true;
                if (x.textContent === right) x.classList.add('is-right');
              });
              const ok = label === right;
              if (ok) { score++; Sound.good(); } else { b.classList.add('is-wrong'); Sound.oops(); }
              after.append(
                h('p', { class: 'why' + (ok ? '' : ' is-wrong') }, h('b', {}, ok ? t('quiz.right') : t('quiz.wrong', { a: right })), ' ', q.why),
                h('div', { class: 'card-actions', style: 'justify-content:flex-start' },
                  h('button', { class: 'btn btn-seal', type: 'button', 'data-next': '', onclick: () => { Sound.page(); i++; if (i < N) ask(); else result(); } }, i + 1 < N ? t('quiz.next') + ' ›' : t('quiz.finish'))));
              const n = after.querySelector('[data-next]');
              if (n) n.focus({ preventScroll: true });
            });
            list.appendChild(b);
          });
          main.appendChild(h('div', { class: 'quiz-card' },
            h('div', { class: 'quiz-meta' }, h('span', {}, t('quiz.q', { a: i + 1, b: N })), h('span', {}, `✓ ${score}`)),
            h('div', { class: 'bar' }, h('i', { style: `width:${(i / N) * 100}%` })),
            h('h2', {}, q.q), list, after));
        }
        function result() {
          const passed = score >= PASS;
          HS.state.quiz.best = Math.max(HS.state.quiz.best || 0, score);
          if (passed) HS.state.quiz.passed = true;
          HS.save();
          stat.textContent = '';
          main.innerHTML = '';
          if (passed) Sound.win(); else Sound.soft();
          main.appendChild(h('div', { class: 'quiz-card' },
            h('h2', {}, t('quiz.score', { a: score, b: N })),
            h('p', {}, passed ? t('quiz.pass') : t('quiz.fail')),
            h('div', { class: 'card-actions', style: 'justify-content:flex-start' },
              passed ? h('button', { class: 'btn btn-seal', type: 'button', onclick: showCert }, t('quiz.certBtn')) : null,
              h('button', { class: passed ? 'btn' : 'btn btn-seal', type: 'button', onclick: () => { Sound.page(); run(); } }, t('quiz.retry')),
              h('button', { class: 'btn', type: 'button', onclick: () => HS.go('album') }, t('ui.backToAlbum')))));
        }
        ask();
      }

      intro();
    },
  };
})();

</script>
<script>
/* 护生之约 · 给老师 (For Teachers) */
(function () {
  'use strict';
  const { h } = HS;

  HS.screens.teacher = {
    enter(root) {
      const t = HS.t;
      const list = (items, ordered) => h(ordered ? 'ol' : 'ul', {}, items.map((x) => h('li', {}, x)));

      const asks = h('ul', { class: 'asks' },
        HS.chapters.map((c) => h('li', {}, h('b', {}, `${HS.pageNo(c.no)} · ${t(c.key + '.title')}：`.replace('：', HS.en() ? ': ' : '：')), t(c.askKey || c.key + '.ask'))));

      // original paintings: which scans are present
      const origList = h('ul', {});
      Object.keys(window.PAINTINGS || {}).forEach((id) => {
        const p = HS.painting(id);
        const status = h('span', { class: 'muted' }, t('teach.checking'));
        origList.appendChild(h('li', {}, h('span', { class: 'brush', lang: 'zh-CN' }, `《${p.title}》`), ' ', HS.en() ? `${p.titleEn} · ` : '', h('code', {}, p.file), ' — ', status));
        HS.hasOriginal(id).then((ok) => {
          status.textContent = ok ? t('teach.found') : t('teach.missing');
          status.style.color = ok ? 'var(--ok)' : 'var(--seal-deep)';
        });
      });

      const easy = h('input', { type: 'checkbox', id: 'hs-easy', class: 'switch' });
      easy.checked = !!HS.state.easy;
      easy.addEventListener('change', () => {
        HS.state.easy = easy.checked;
        HS.save();
        if (easy.checked) HS.toast(t('ui.easyOn'));
      });

      const confirm = h('div', { class: 'confirm', hidden: true },
        h('p', {}, t('teach.resetAsk')),
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn btn-small btn-seal', type: 'button', onclick: () => { HS.reset(); confirm.hidden = true; HS.toast(t('teach.resetDone')); } }, t('teach.resetYes')),
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => { confirm.hidden = true; } }, t('teach.resetNo'))));

      root.appendChild(h('article', { class: 'doc' },
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => HS.go('album') }, '‹ ' + t('ui.album')),
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => HS.go('title') }, t('ui.cover')),
          HS.langButton()),
        h('h1', {}, t('teach.title')),
        h('section', {}, h('h2', {}, t('teach.who.t')), h('p', {}, t('teach.who'))),
        h('section', {}, h('h2', {}, t('teach.goals.t')), list(t('teach.goals'), true)),
        h('section', {}, h('h2', {}, t('teach.flow.t')), list(t('teach.flow'), true)),
        h('section', {}, h('h2', {}, t('teach.ask.t')), asks),
        h('section', {}, h('h2', {}, t('teach.orig.t')), h('p', {}, t('teach.orig')), origList, h('p', { class: 'muted', style: 'font-size:.95rem' }, t('teach.rights'))),
        h('section', {}, h('h2', {}, t('teach.about.t')), h('p', {}, t('teach.about'))),
        h('section', {}, h('h2', {}, t('teach.links.t')), h('p', {}, t('teach.links'))),
        h('section', {}, h('h2', {}, t('teach.settings.t')),
          h('label', { class: 'setting', for: 'hs-easy' }, easy, h('span', {}, t('teach.easy')), h('small', {}, t('teach.easyDesc'))),
          h('div', {}, h('button', { class: 'btn btn-small', type: 'button', onclick: () => { confirm.hidden = false; } }, t('teach.reset'))),
          confirm)));
    },
  };
})();

</script>
<script>
/* 护生之约 · main.js: start the game */
(function () {
  'use strict';
  let booted = false;

  function boot(data) {
    if (booted) return;
    booted = true;
    const defs = document.createElementNS(HS.NS, 'svg');
    defs.setAttribute('width', '0');
    defs.setAttribute('height', '0');
    defs.setAttribute('aria-hidden', 'true');
    defs.setAttribute('focusable', 'false');
    defs.style.position = 'absolute';
    defs.innerHTML = '<defs>' + Art.defs() + '</defs>';
    document.body.prepend(defs);

    HS.applyLang();
    Sound.setEnabled(HS.state.sound);
    HS.warmDownloads();

    const wanted = data && data.screen && HS.screens[data.screen] ? data.screen : HS.routeFromHash();
    HS.go(wanted || 'title', { keepHash: true });

    window.addEventListener('hashchange', () => {
      const id = HS.routeFromHash();
      if (id && id !== HS.current()) HS.go(id, { keepHash: true });
    });
    const unlock = () => {
      Sound.unlock();
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
  }

  /* When hosted as a Claude artifact, keep the current screen across live updates. */
  let hot = null;
  try { hot = window.claude && window.claude.hot; } catch (e) { hot = null; }
  if (hot && typeof hot.snapshot === 'function') {
    try { hot.snapshot(() => ({ screen: HS.current() })); } catch (e) { /* optional */ }
  }
  if (hot && typeof hot.ready === 'function') {
    try { hot.ready(boot); } catch (e) { boot({}); }
    setTimeout(() => boot({}), 1500);
  } else {
    boot((hot && hot.data) || {});
  }
})();

</script>
