    for (let i = -3; i <= 3; i++) b += `<path d="M${i * 11}-22L${i * 9} 12" stroke="${C.ink}" stroke-width=".8" stroke-opacity=".5"/>`;
    b += `<path d="M-38-12L38-12M-35 0L35 0" stroke="${C.ink}" stroke-width=".8" stroke-opacity=".5"/><ellipse cx="0" cy="-22" rx="40" ry="6" fill="#8d6b46" fill-opacity=".6" stroke="${C.ink}" stroke-width="1.4"/>`;
    return b;
  }

  function banks() {
    let s = `<rect width="1000" height="625" fill="#f2ecdf"/>`;
    s += A.blob(500, 600, 560, 70, C.ochre, 0.22) + A.blob(40, 330, 60, 240, C.green, 0.18) + A.blob(970, 330, 50, 220, C.green, 0.16);
    return s;
  }

  function staticTop() {
    let s = lotusLeaf(165, 245, 58, 26, -8) + lotusLeaf(305, 470, 64, 28, 10) + lotusLeaf(790, 215, 56, 24, 4) + lotusLeaf(835, 455, 62, 27, -6);
    s += lotusBud(185, 250, 1) + lotusBud(820, 460, 0.8);
    s += reeds(70, 560, 1.1, 3) + reeds(960, 420, 0.9, 5);
    s += A.place(basket(), { x: BASKET.x, y: BASKET.y });
    s += A.willowFringe(0, 1000, 0, 5, { count: 11, min: 50, max: 150 });
    return s;
  }

  function tangle() {
    A.seed(61);
    const pts = [];
    for (let i = 0; i < 12; i++) pts.push([A.rnd(-28, 28), A.rnd(-14, 14)]);
    return `<g class="tangle">${A.line(pts, 1, { color: '#6c6660', op: 0.9 })}${A.line([[-24, 4], [-60, 18], [-100, 10], [-130, 26]], 1, { color: '#6c6660', op: 0.7 })}</g>`;
  }

  function painting() {
    let s = banks();
    s += `<path d="${pondShape()}" fill="#98c6c4" fill-opacity=".5" stroke="${C.ink}" stroke-width="1.6" stroke-opacity=".5"/>`;
    s += A.rainDrops(1000, 625, 60, 11);
    A.seed(4);
    [[420, 300], [600, 380], [520, 250]].forEach(([x, y]) => {
      s += `<ellipse cx="${x}" cy="${y}" rx="26" ry="8" fill="none" stroke="${C.ink}" stroke-opacity=".35"/><ellipse cx="${x}" cy="${y}" rx="44" ry="13" fill="none" stroke="${C.ink}" stroke-opacity=".18"/>`;
    });
    s += A.place(A.fish('#d9765a'), { x: 440, y: 330, r: -20, s: 1.2 }) + A.place(A.fish('#8f9c8a'), { x: 600, y: 400, r: 170, s: 1.1 }) + A.place(A.fish('#8f9c8a'), { x: 530, y: 272, r: 20, s: 1 });
    s += staticTop();
    s += A.place(A.dragonfly(), { x: 185, y: 150, s: 1, r: 20 });
    s += A.swallow(600, 120, 1.1, -24) + A.swallow(700, 150, 0.9, -30);
    return s;
  }

  function pov() {
    let s = `<rect width="1000" height="420" fill="#cfe1dd"/>`;
    for (let i = 0; i < 6; i++) s += `<path d="M${150 + i * 140} 0L${110 + i * 150} 420L${170 + i * 150} 420Z" fill="#fff" fill-opacity=".18"/>`;
    s += `<path d="M300 30C260 60 280 150 360 170 450 195 560 160 640 175 720 190 760 120 720 60 690 20 600 40 520 30 440 20 350 10 300 30Z" fill="#3a3f45" fill-opacity=".72"/>`;
    s += `<path d="M430 170L440 230M560 165L555 225" stroke="#3a3f45" stroke-opacity=".6" stroke-width="3"/>`;
    s += A.place(A.fish('#d9765a'), { x: 520, y: 330, s: 1.6, r: -8 });
    s += A.blob(500, 440, 520, 50, '#7a8c6c', 0.4);
    return s;
  }

  HS.chapter({
    id: 'pond', key: 'pond', no: 2,
    painting, pov,
    play(ctx) {
      return new Promise((resolve) => {
        const t = ctx.t;
        ctx.add('bg', banks());
        const water = ctx.add('water', `<path d="${pondShape()}" fill="#9aa37f" fill-opacity=".55" stroke="${C.ink}" stroke-width="1.6" stroke-opacity=".5"/>`).firstChild;
        const fishLayer = ctx.layer('fish');
        ctx.add('top', staticTop());
        const trashLayer = ctx.layer('trash');
        const fxLayer = ctx.layer('fx');

        const inside = (x, y, m = 0.86) => ((x - POND.cx) / POND.rx) ** 2 + ((y - POND.cy) / POND.ry) ** 2 < m * m;

        // fish
        const fishes = [];
        const nFish = 6;
        for (let i = 0; i < nFish; i++) {
          const tangled = i === 2;
          const el = HS.sprite(fishLayer, A.fish(FISH_COLORS[i]) + (tangled ? tangle() : ''));
          const a = Math.random() * Math.PI * 2, rr = Math.random() * 0.6;
          fishes.push({
            el, tangled, x: POND.cx + Math.cos(a) * POND.rx * rr, y: POND.cy + Math.sin(a) * POND.ry * rr,
            th: Math.random() * Math.PI * 2, v: 40 + Math.random() * 25, turn: 0, scare: 0, s: tangled ? 1.15 : 0.85 + Math.random() * 0.35,
          });
        }

        // rubbish drifts in from upstream
        const total = ctx.easy ? 8 : 10;
        const trash = [];
        let spawned = 0;
        function spawnTrash(initial) {
          if (spawned >= total) return;
          const kind = TRASH_KINDS[spawned % TRASH_KINDS.length];
          const el = HS.sprite(trashLayer, TRASH[kind](), { class: 'hit' });
          let x, y;
          if (initial) {
            do { x = 180 + Math.random() * 640; y = 200 + Math.random() * 260; } while (!inside(x, y, 0.8) || trash.some((q) => HS.dist(q.x, q.y, x, y) < 90));
          } else { x = 70; y = 250 + Math.random() * 200; }
          trash.push({ el, x, y, vx: 9 + Math.random() * 9, ph: Math.random() * 6, rot: Math.random() * 40 - 20, state: 'float', f: 0, sx: 0, sy: 0 });
          spawned++;
        }
        for (let i = 0; i < 5; i++) spawnTrash(true);
        let spawnClock = 0;

        let collected = 0, freed = 0, startled = 0, done = false, hintClock = 0;
        const stat = () => ctx.stat(t('pond.stat', { a: collected, b: total, c: freed, d: startled }));
        stat();

        const netMarkup = `<ellipse cx="0" cy="0" rx="30" ry="18" fill="#f5f1e6" fill-opacity=".25" stroke="${C.ink}" stroke-width="2"/><path d="M-26-8L26 8M-26 8L26-8M-14-16L-14 16M0-18L0 18M14-16L14 16" stroke="${C.ink}" stroke-width=".7" stroke-opacity=".6"/><path d="M26-6L90-70" stroke="${C.brown}" stroke-width="4" stroke-linecap="round"/>`;
        function netAt(x, y) {
          const n = HS.sprite(fxLayer, netMarkup);
          HS.setPos(n, x, y);
          if (n.animate && !HS.reducedMotion()) {
            n.animate([{ opacity: 1, transform: `translate(${x}px, ${y}px) scale(.7) rotate(-10deg)` }, { opacity: 0, transform: `translate(${x}px, ${y - 20}px) scale(1.1) rotate(8deg)` }], { duration: 650, easing: 'ease-out' }).onfinish = () => n.remove();
          } else ctx.after(500, () => n.remove());
        }
        function ripple(x, y) {
          const r = HS.sprite(fxLayer, `<ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="${C.ink}" stroke-opacity=".5" stroke-width="1.4"/>`);
          HS.setPos(r, x, y);
          if (r.animate && !HS.reducedMotion()) r.animate([{ opacity: 1, transform: `translate(${x}px, ${y}px) scale(.5)` }, { opacity: 0, transform: `translate(${x}px, ${y}px) scale(2.6)` }], { duration: 800, easing: 'ease-out' }).onfinish = () => r.remove();
          else ctx.after(600, () => r.remove());
        }

        function checkWin() {
          if (done) return;
          if (collected >= total && freed >= 1) {
            done = true;
            ctx.say(t('pond.win'), 4200);
            Sound.win();
            ctx.after(2600, () => { stopLoop(); resolve({ seals: startled === 0 ? 3 : startled <= 2 ? 2 : 1 }); });
          } else if (collected >= total) {
            ctx.say(t('pond.tangledHint'), 4000);
          }
        }

        ctx.on(ctx.svg, 'pointerdown', (e) => {
          if (done) return;
          e.preventDefault();
          const p = ctx.point(e);
          const near = (o, r) => HS.dist(o.x, o.y, p.x, p.y) < r * ctx.reach;
          const tr = trash.filter((q) => q.state === 'float' && near(q, 38)).sort((a, b) => HS.dist(a.x, a.y, p.x, p.y) - HS.dist(b.x, b.y, p.x, p.y))[0];
          if (tr) {
            tr.state = 'fly'; tr.f = 0; tr.sx = tr.x; tr.sy = tr.y;
            netAt(tr.x, tr.y);
            Sound.plop();
            return;
          }
          const tf = fishes.find((f) => f.tangled && near(f, 44));
          if (tf) {
            tf.tangled = false;
            const tg = tf.el.querySelector('.tangle');
            if (tg) {
              if (tg.animate && !HS.reducedMotion()) tg.animate([{ opacity: 1 }, { opacity: 0, transform: 'translate(-30px, 10px)' }], { duration: 700 }).onfinish = () => tg.remove();
              else tg.remove();
            }
            freed = 1;
            tf.scare = 0.6;
            stat();
            Sound.good();
            ctx.say(t('pond.freed'), 3200);
            ctx.float(tf.x, tf.y - 30, '♡', C.seal, 30);
            checkWin();
            return;
          }
          const f = fishes.find((q) => near(q, 30));
          if (f) {
            f.scare = 0.9; f.th += Math.PI * (0.6 + Math.random() * 0.8);
            startled++;
            stat();
            Sound.splash();
            ctx.float(f.x, f.y - 24, '!', C.seal, 32);
            if (startled === 1 || startled % 3 === 0) ctx.say(t('pond.oops'), 2600);
            return;
          }
          if (inside(p.x, p.y, 1)) ripple(p.x, p.y);
        });

        let pointer = null;
        ctx.on(ctx.svg, 'pointermove', (e) => { pointer = ctx.point(e); });
        ctx.on(ctx.svg, 'pointerleave', () => { pointer = null; });

        const murky = [154, 163, 127], clear = [143, 196, 198];
        const stopLoop = ctx.loop((dt, now) => {
          // new rubbish every few seconds
          spawnClock += dt;
          if (spawnClock > 3.6 && spawned < total) { spawnClock = 0; spawnTrash(false); }
          if (!done && collected >= total && freed < 1) {
            hintClock += dt;
            if (hintClock > 6) { hintClock = 0; ctx.say(t('pond.tangledHint'), 3600); }
          }
          // fish
          for (const f of fishes) {
            f.turn += (Math.random() - 0.5) * 3 * dt;
            f.turn *= 0.96;
            f.th += f.turn * dt * 2;
            if (!inside(f.x, f.y, 0.78)) {
              const want = Math.atan2(POND.cy - f.y, POND.cx - f.x);
              let d = want - f.th;
              while (d > Math.PI) d -= Math.PI * 2;
              while (d < -Math.PI) d += Math.PI * 2;
              f.th += d * dt * 2.4;
            }
            if (pointer && !f.tangled && HS.dist(pointer.x, pointer.y, f.x, f.y) < 70) {
              const away = Math.atan2(f.y - pointer.y, f.x - pointer.x);
              let d = away - f.th;
              while (d > Math.PI) d -= Math.PI * 2;
              while (d < -Math.PI) d += Math.PI * 2;
              f.th += d * dt * 3;
            }
            f.scare = Math.max(0, f.scare - dt);
            const v = f.v * ctx.speed * (f.tangled ? 0.35 : 1) * (f.scare > 0 ? 3.2 : 1);
            f.x += Math.cos(f.th) * v * dt;
            f.y += Math.sin(f.th) * v * dt;
            const left = Math.cos(f.th) < 0;
            f.el.setAttribute('transform', `translate(${f.x.toFixed(1)} ${f.y.toFixed(1)}) rotate(${((f.th * 180) / Math.PI).toFixed(1)}) scale(${f.s} ${left ? -f.s : f.s})`);
          }
          // rubbish
          for (const q of trash) {
            if (q.state === 'float') {
              q.x += q.vx * dt * ctx.speed;
              q.y += Math.sin(now * 1.3 + q.ph) * 6 * dt;
              if (q.x > 940) { q.x = 70; q.y = 240 + Math.random() * 220; }
              HS.setPos(q.el, q.x, q.y + Math.sin(now * 2 + q.ph) * 2, q.rot + Math.sin(now + q.ph) * 6, 1.25);
            } else if (q.state === 'fly') {
              q.f = Math.min(1, q.f + dt * 1.6);
              const k = q.f;
              const x = HS.lerp(q.sx, BASKET.x, k), y = HS.lerp(q.sy, BASKET.y - 24, k) - Math.sin(k * Math.PI) * 140;
              HS.setPos(q.el, x, y, q.rot + k * 300, 1.25 * (1 - k * 0.5));
              if (q.f >= 1) {
                q.state = 'done';
                q.el.remove();
                collected++;
                stat();
                Sound.tap();
                checkWin();
              }
            }
          }
          // the water clears as the rubbish comes out
          const k = collected / total;
          const col = murky.map((m, i) => Math.round(HS.lerp(m, clear[i], k)));
          water.setAttribute('fill', `rgb(${col.join(',')})`);
        });
      });
    },
  });
})();

</script>
<script>
/* 护生之约 · 第三页 · 纱灯 (The Gauze Lamp)
 * Guide the moths away from the flame, put a gauze shade over the lamp,
 * then blow the lamp out and let them fly to the moon. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const WIN = { x: 230, y: 235, r: 150 };
  const LAMP = { x: 700, y: 430, s: 0.95 };
  const FLAME = { x: 701, y: 312 };
  const GAUZE_HOME = { x: 380, y: 585 };

  function room(o = {}) {
    let s = `<rect width="1000" height="625" fill="#ecebe3"/>`;
    s += `<rect width="1000" height="625" fill="#5b6b86" class="room-tint" fill-opacity="${o.dark ? 0.3 : 0.08}"/>`;
    // round window onto the night
    s += `<circle cx="${WIN.x}" cy="${WIN.y}" r="${WIN.r}" fill="#26324a"/>`;
    A.seed(7);
    for (let i = 0; i < 14; i++) {
      const a = A.rnd(0, 6.28), rr = A.rnd(20, WIN.r - 12);
      s += `<circle cx="${(WIN.x + Math.cos(a) * rr).toFixed(0)}" cy="${(WIN.y + Math.sin(a) * rr).toFixed(0)}" r="${A.rnd(0.8, 1.8).toFixed(1)}" fill="#f5efd6" fill-opacity=".8"/>`;
    }
    s += A.moon(WIN.x + 40, WIN.y - 60, 28, { glow: true, fill: '#f6ebbd' });
    s += A.place(A.willowFringe(-120, 120, 0, 13, { count: 5, min: 60, max: 180 }).replace(new RegExp(C.leaf, 'g'), '#4f6a57').replace(/#2a2521/g, '#17202e'), { x: WIN.x - 20, y: WIN.y - WIN.r + 6 });
    s += `<circle cx="${WIN.x}" cy="${WIN.y}" r="${WIN.r + 9}" fill="none" stroke="${C.brown}" stroke-width="14" stroke-opacity=".8"/><circle cx="${WIN.x}" cy="${WIN.y}" r="${WIN.r}" fill="none" stroke="${C.ink}" stroke-width="2.4"/>`;
    // floor, desk and things on it
    s += A.line([[0, 575], [1000, 580]], 1.4, { op: 0.45 });
    s += A.desk(470, 960, 430, 150);
    s += A.books(560, 430) + A.brushPot(890, 430) + A.paperStack(800, 430, 3);
    s += `<ellipse cx="160" cy="590" rx="80" ry="16" fill="${C.indigo}" fill-opacity=".35"/>`;
    s += A.place(A.cat({ pose: 'sleep' }), { x: 160, y: 584, s: 0.9 });
    return s;
  }

  function painting() {
    let s = room({ dark: true });
    s += `<path d="M150 150L520 560 760 560 300 120Z" fill="#fff6d6" fill-opacity=".22"/>`;
    s += A.place(A.lamp({ unlit: true }), { x: LAMP.x, y: LAMP.y, s: LAMP.s });
    s += A.place(A.gauze(), { x: LAMP.x, y: 340, s: 0.9 });
    [[300, 200, -30], [360, 260, -50], [260, 300, -20]].forEach(([x, y, r]) => { s += A.place(A.moth(), { x, y, r, s: 0.8 }); });
    s += A.kid({ x: 430, y: 578, s: 1.1, jacket: C.rouge, hair: 'boy', arms: { l: [[-18, -66], [-12, -50]], r: [[-4, -84], [-30, -104]] } });
    return s;
  }

  function pov() {
    let s = `<rect width="1000" height="420" fill="#2a3346"/>`;
    s += `<circle cx="600" cy="210" r="230" fill="url(#hs-glow)"/>`;
    for (let i = 1; i <= 4; i++) s += `<circle cx="600" cy="210" r="${i * 42}" fill="none" stroke="#f6d27a" stroke-opacity="${0.4 - i * 0.07}" stroke-width="2"/>`;
    s += `<path d="M600 150C630 175 630 225 600 240 570 225 570 175 600 150Z" fill="url(#hs-flame)"/>`;
    let d = 'M180 380';
    for (let i = 0; i < 40; i++) {
      const a = i * 0.45, r = 250 - i * 5.2;
      d += ` L${(600 + Math.cos(a) * r * 1.3).toFixed(0)} ${(210 + Math.sin(a) * r * 0.7).toFixed(0)}`;
    }
    s += `<path d="${d}" fill="none" stroke="#f5efd6" stroke-opacity=".45" stroke-width="1.6" stroke-dasharray="4 7"/>`;
    s += A.place(A.moth(), { x: 250, y: 330, s: 2.2, r: 40 });
    return s;
  }

  HS.chapter({
    id: 'moths', key: 'moth', no: 3,
    painting, pov,
    play(ctx) {
      return new Promise((resolve) => {
        const t = ctx.t;
        ctx.add('bg', room());
        const tint = ctx.svg.querySelector('.room-tint');
        const glow = ctx.add('glow', `<circle cx="${FLAME.x}" cy="${FLAME.y}" r="210" fill="url(#hs-glow)"/>`);
        const beam = ctx.add('beam', `<path d="M150 150L520 560 760 560 300 120Z" fill="#fff6d6" fill-opacity=".22"/>`, { opacity: '0' });
        const lamp = ctx.add('lamp', A.lamp());
        HS.setPos(lamp, LAMP.x, LAMP.y, 0, LAMP.s);
        const flame = lamp.querySelector('.flame');
        const mothLayer = ctx.layer('moths');
        const gauze = ctx.add('gauze', A.gauze(), { opacity: '0', class: 'hit' });

        const total = ctx.easy ? 9 : 12;
        const moths = [];
        let spawned = 0, saved = 0, burned = 0, spawnClock = 1.2, elapsed = 0;
        let gauzeState = 'hidden'; // hidden → offered → dragging → on
        let lampOn = true, ended = false, cueClock = 0, asked = false;
        const stat = () => ctx.stat(t('moth.stat', { a: saved, b: burned }));
        stat();

        function spawn() {
          const a = Math.random() * Math.PI * 2, rr = Math.random() * (WIN.r - 40);
          const el = HS.sprite(mothLayer, A.moth(), { class: 'hit' });
          moths.push({ el, x: WIN.x + Math.cos(a) * rr, y: WIN.y + Math.sin(a) * rr, vx: 40, vy: 0, state: 'in', clock: 0, dir: Math.random() < 0.5 ? 1 : -1, ph: Math.random() * 6, speed: 60 + Math.random() * 30 });
          spawned++;
        }

        function guide(m) {
          if (m.state === 'out' || m.state === 'gone') return;
          m.state = 'out';
          m.tx = WIN.x + 30 + (Math.random() - 0.5) * 60;
          m.ty = WIN.y - 50 + (Math.random() - 0.5) * 60;
          Sound.soft();
          if (saved === 0) ctx.say(t('moth.saved'), 2400);
        }

        function offerGauze() {
          gauzeState = 'offered';
          gauze.setAttribute('opacity', '1');
          gauze.classList.add('pulse');
          HS.setPos(gauze, GAUZE_HOME.x, GAUZE_HOME.y, 0, 0.9);
          ctx.say(t('moth.gauzeCue'), 5200);
          Sound.good();
        }

        function lampOut() {
          lampOn = false;
          Sound.blow();
          if (flame) {
            if (flame.animate && !HS.reducedMotion()) flame.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 600, fill: 'forwards' });
            else flame.style.opacity = '0';
          }
          moths.forEach((m) => { if (m.state !== 'gone') { m.state = 'out'; m.tx = WIN.x + 40 + (Math.random() - 0.5) * 80; m.ty = WIN.y - 60 + (Math.random() - 0.5) * 60; } });
          ctx.after(3200, () => {
            ended = true;
            ctx.say(t('moth.win'), 4200);
            Sound.win();
            ctx.after(2200, () => { stopLoop(); resolve({ seals: burned === 0 ? 3 : burned <= 2 ? 2 : 1 }); });
          });
        }

        // pointer: tap moths; drag the gauze shade onto the lamp; tap the flame to blow it out at the end
        let drag = null;
        ctx.on(ctx.svg, 'pointerdown', (e) => {
          if (ended) return;
          e.preventDefault();
          const p = ctx.point(e);
          if ((gauzeState === 'offered') && HS.dist(p.x, p.y, gaX(), gaY() - 38) < 70) {
            gauzeState = 'dragging';
            gauze.classList.remove('pulse');
            drag = { dx: gaX() - p.x, dy: gaY() - p.y };
            try { ctx.svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
            ctx.svg.classList.add('is-dragging');
            return;
          }
          const m = moths.filter((q) => q.state === 'in' || q.state === 'circle').sort((a, b) => HS.dist(a.x, a.y, p.x, p.y) - HS.dist(b.x, b.y, p.x, p.y))[0];
          if (m && HS.dist(m.x, m.y, p.x, p.y) < 44 * ctx.reach) { guide(m); return; }
          if (asked && lampOn && HS.dist(p.x, p.y, FLAME.x, FLAME.y) < 50) lampOut();
        });
        let gx = GAUZE_HOME.x, gy = GAUZE_HOME.y;
        const gaX = () => gx, gaY = () => gy;
        ctx.on(ctx.svg, 'pointermove', (e) => {
          if (gauzeState !== 'dragging' || !drag) return;
          const p = ctx.point(e);
          gx = p.x + drag.dx; gy = p.y + drag.dy;
          HS.setPos(gauze, gx, gy, 0, 0.9);
        });
        const drop = () => {
          if (gauzeState !== 'dragging') return;
          ctx.svg.classList.remove('is-dragging');
          drag = null;
          if (HS.dist(gx, gy - 40, FLAME.x, FLAME.y) < 95) {
            gauzeState = 'on';
            gx = LAMP.x; gy = 340;
            HS.setPos(gauze, gx, gy, 0, 0.9);
            Sound.stamp();
            ctx.say(t('moth.gauzeOn'), 4200);
          } else {
            gauzeState = 'offered';
            gauze.classList.add('pulse');
          }
        };
        ctx.on(ctx.svg, 'pointerup', drop);
        ctx.on(ctx.svg, 'pointercancel', drop);

        const stopLoop = ctx.loop((dt, now) => {
          elapsed += dt;
          spawnClock -= dt;
          const alive = moths.filter((m) => m.state !== 'gone').length;
          if (lampOn && spawned < total && spawnClock <= 0 && alive < 4) { spawn(); spawnClock = (ctx.easy ? 4.2 : 3.2) + Math.random(); }
          if (gauzeState === 'hidden' && (saved + burned >= 6 || elapsed > 28)) offerGauze();
          if (gauzeState === 'offered') {
            cueClock += dt;
            if (cueClock > 9) { cueClock = 0; ctx.say(t('moth.gauzeCue'), 4000); }
          }
          if (gauzeState === 'on' && !asked && spawned >= total && lampOn) {
            asked = true;
            ctx.card({ body: [t('moth.moonAsk')], button: t('moth.blow') }).then(() => { if (lampOn) lampOut(); });
          }
          // lamp glow and room tint
          const g = lampOn ? 1 : Math.max(0, Number(glow.getAttribute('opacity') || 1) - dt);
          glow.setAttribute('opacity', g.toFixed(2));
          if (!lampOn) {
            tint.setAttribute('fill-opacity', Math.min(0.3, Number(tint.getAttribute('fill-opacity')) + dt * 0.15).toFixed(3));
            beam.setAttribute('opacity', Math.min(1, Number(beam.getAttribute('opacity')) + dt * 0.6).toFixed(2));
          }
          // moths
          for (const m of moths) {
            if (m.state === 'gone') continue;
            m.clock += dt;
            let ax = 0, ay = 0, sp = m.speed * ctx.speed;
            if (m.state === 'in' || m.state === 'circle') {
              const dx = FLAME.x - m.x, dy = FLAME.y - m.y, d = Math.hypot(dx, dy) || 1;
              const guard = gauzeState === 'on' ? 62 : 0;
              if (guard && d < guard + 26) m.state = 'circle';
              const pull = m.state === 'circle' ? (d - guard - 20) / 40 : 0.85;
              ax = (dx / d) * pull + (-dy / d) * 0.65 * m.dir;
              ay = (dy / d) * pull + (dx / d) * 0.65 * m.dir;
              if (!guard && d < 22 && lampOn) {
                burned++;
                stat();
                Sound.hot();
                ctx.float(m.x, m.y - 20, t('moth.hot'), C.seal, 26);
                m.state = 'dazed'; m.clock = 0; m.burned = true;
                m.vx = -m.vx * 0.5; m.vy = 40;
              }
            } else if (m.state === 'dazed') {
              ax = (Math.random() - 0.5) * 0.4; ay = 0.3;
              sp = 30;
              if (m.clock > 1.6) { m.state = 'out'; m.tx = WIN.x + 20; m.ty = WIN.y - 40; }
            } else if (m.state === 'out') {
              const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy) || 1;
              ax = dx / d; ay = dy / d;
              sp = 150;
              if (d < 24) {
                m.state = 'gone';
                if (lampOn && !m.burned) { saved++; stat(); }
                const el = m.el;
                if (el.animate && !HS.reducedMotion()) el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' }).onfinish = () => el.remove();
                else el.remove();
                continue;
              }
            }
            const flutter = Math.sin(now * 7 + m.ph) * 0.5;
            m.vx += ((ax + flutter * 0.4) * sp - m.vx) * Math.min(1, dt * 3);
            m.vy += ((ay + Math.cos(now * 6 + m.ph) * 0.4) * sp - m.vy) * Math.min(1, dt * 3);
            m.x += m.vx * dt; m.y += m.vy * dt;
            m.x = HS.clamp(m.x, 20, 980); m.y = HS.clamp(m.y, 20, 600);
            HS.setPos(m.el, m.x, m.y, (Math.atan2(m.vy, m.vx) * 180) / Math.PI + 90, 0.9);
          }
        });
      });
    },
  });
})();

</script>
<script>
/* 护生之约 · 第四页 · 望母归 (Waiting for Mother)
 * Talk a boy out of shooting a mother bird, then carry a fallen chick
 * back to its nest, slowly enough that it is not frightened. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const NEST = { x: 705, y: 196 };
  const GROUND_Y = 572;
  // branches the chick must be carried around: [points, width]
  const BRANCHES = [
    [[[790, 468], [690, 452], [590, 432]], 15],
    [[[775, 336], [700, 318], [628, 300]], 13],
    [[[780, 214], [742, 206], [655, 205]], 11],
    [[[805, 400], [880, 360], [950, 330]], 12],
  ];

  function tree() {
    let s = '';
    A.seed(33);
    s += A.blob(700, 170, 250, 120, C.ochre, 0.3) + A.blob(560, 250, 120, 80, C.rouge, 0.18) + A.blob(880, 230, 120, 110, C.ochre, 0.26) + A.blob(780, 90, 160, 70, '#c9b25b', 0.25);
    s += A.stroke([[800, 640], [790, 520], [772, 380], [778, 240], [766, 60]], 30, { head: 1, tail: 0.5, wob: 0.06 });
    s += A.line([[790, 560], [786, 540]], 1.2, { op: 0.4 }) + A.line([[778, 420], [782, 400]], 1.2, { op: 0.4 });
    for (const [pts, w] of BRANCHES) s += A.stroke(pts, w, { head: 1, tail: 0.35, wob: 0.05 });
    s += A.stroke([[770, 150], [700, 110], [610, 96]], 8, { head: 1, tail: 0.2 }) + A.stroke([[776, 120], [860, 80], [940, 70]], 8, { head: 1, tail: 0.2 });
    for (let i = 0; i < 26; i++) {
      const x = A.rnd(520, 980), y = A.rnd(40, 420);
      if (Math.abs(x - NEST.x) < 60 && Math.abs(y - NEST.y) < 40) continue;
      s += A.place(A.leafShape([C.ochre, '#c26a4a', '#b8b35a', '#a8743f'][i % 4]), { x, y, r: A.rnd(0, 180), s: A.rnd(0.7, 1.1) });
    }
    return s;
  }

  function ground() {
    let s = `<rect width="1000" height="625" fill="#f4ede0"/>`;
    s += A.hills(430, 71, { color: C.indigo, op: 0.12, h: 90 });
    s += A.shape(`M-20 ${GROUND_Y}L1020 ${GROUND_Y - 6} 1020 640-20 640Z`, C.ochre, 0.2, { filter: 'hs-wash' });
    s += A.line([[-10, GROUND_Y], [1010, GROUND_Y - 6]], 1.3, { op: 0.45 });
    s += A.grass(90, GROUND_Y + 8, 1.2, 5) + A.grass(470, GROUND_Y + 6, 1, 6) + A.grass(940, GROUND_Y + 2, 1.1, 7);
    return s;
  }

  const nestChicks = (open) => A.place(A.chickHead(open), { x: NEST.x - 18, y: NEST.y - 10, s: 1.25 }) + A.place(A.chickHead(open), { x: NEST.x + 16, y: NEST.y - 12, s: 1.25, flip: true });

  function boy(aiming) {
    const arms = aiming
      ? { l: [[20, -86], [34, -110]], r: [[22, -88], [40, -116]] }
      : { l: [[-18, -64], [-14, -48]], r: [[18, -62], [16, -46]] };
    let s = A.kid({ x: 250, y: GROUND_Y, s: 1.3, jacket: '#6f8aa4', hair: 'boy', arms });
    s += aiming ? A.place(A.slingshot(), { x: 250 + 40 * 1.3, y: GROUND_Y - 116 * 1.3, s: 1.4, r: 30 }) : A.place(A.slingshot(), { x: 330, y: GROUND_Y + 2, s: 1.2, r: 100 });
    return s;
  }

  function painting() {
    let s = ground() + tree();
    s += A.place(A.nest(), { x: NEST.x, y: NEST.y + 8, s: 1.3 }) + nestChicks(true) + A.place(A.chickHead(true), { x: NEST.x - 2, y: NEST.y - 16, s: 1.2 });
    s += A.place(A.bird({ color: '#8f7b5d', fly: true }), { x: NEST.x - 70, y: NEST.y - 50, s: 1.1, r: 10 });
    s += boy(false);
    s += A.kid({ x: 400, y: GROUND_Y + 2, s: 1.2, jacket: C.rouge, hair: 'girl', arms: { l: [[-18, -66], [-12, -50]], r: [[22, -88], [34, -112]] } });
    return s;
  }

  function pov() {
    let s = `<rect width="1000" height="420" fill="#efe7d6"/>`;
    s += A.place(A.nest(), { x: 820, y: 60, s: 0.8 }) + A.stroke([[1000, 70], [860, 66], [780, 60]], 5);
    A.seed(14);
    for (let i = 0; i < 30; i++) {
      const x = A.rnd(0, 1000), h = A.rnd(180, 380);
      s += A.stroke([[x, 430], [x + A.rnd(-20, 20), 430 - h * 0.5], [x + A.rnd(-50, 50), 430 - h]], A.rnd(10, 18), { color: i % 3 ? '#8aa46d' : '#6f8f55', op: 0.75, head: 1, tail: 0.1 });
    }
    s += A.place(A.fledgling(), { x: 470, y: 380, s: 2.2 });
    return s;
  }

  // distance from a point to a segment
  function segDist(px, py, ax, ay, bx, by) {
    const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1;
    const k = HS.clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1);
    return Math.hypot(px - (ax + dx * k), py - (ay + dy * k));
  }
  function hitsBranch(x, y, r) {
    for (const [pts, w] of BRANCHES) {
      for (let i = 0; i < pts.length - 1; i++) {
        if (segDist(x, y, pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]) < r + w * 0.45) return true;
      }
    }
    return false;
  }

  HS.chapter({
    id: 'nest', key: 'nest', no: 4,
    painting, pov,
    askKey: 'nest.ask2',
    skipHowto: true,
    play(ctx) {
      return new Promise((resolve) => {
        const t = ctx.t, en = HS.en();
        ctx.add('bg', ground() + tree());
        ctx.add('nest', A.place(A.nest(), { x: NEST.x, y: NEST.y + 8, s: 1.3 }));
        const chicks = ctx.add('chicks', nestChicks(true));
        const mother = ctx.add('mother', A.bird({ color: '#8f7b5d' }));
        HS.setPos(mother, 648, 279, 0, 1.1, true);
        const boyEl = ctx.add('boy', boy(true));
        const leafFx = ctx.layer('leaffx');
        const fx = ctx.layer('carry');

        // chicks cheep now and then
        const stopBob = ctx.loop((dt, now) => {
          chicks.setAttribute('transform', `translate(0 ${(Math.sin(now * 8) * 1.5).toFixed(1)})`);
        });
        let cheepClock = 0;
        const stopCheep = ctx.loop((dt) => { cheepClock += dt; if (cheepClock > 3.5) { cheepClock = 0; Sound.chirp(3, 3200); } });

        const who = en ? 'Boy' : '男孩';
        ctx.dialogue({
          speaker: who, line: t('nest.boy1'), prompt: t('nest.ask'), replier: who,
          options: HS.shuffle([
            { value: 1, label: t('nest.opt1'), reply: t('nest.res1'), hint: t('nest.hint1') },
            { value: 2, label: t('nest.opt2'), reply: t('nest.res2'), correct: true },
            { value: 3, label: t('nest.opt3'), reply: t('nest.res3'), hint: t('nest.hint3') },
          ]),
          onRight: () => {
            boyEl.innerHTML = boy(false);
            Sound.chirp(3, 3000);
          },
          onWrong: () => Sound.oops(),
        }).then(async (res) => {
          const tries = res.tries.length;
          await ctx.card({
            eyebrow: t('nest.poemBy'),
            title: HS.zh('nest.verse'),
            body: [note(t('nest.good')), zhPoem(HS.zh('nest.poem')), en ? t('nest.poemEn') : t('nest.poemGloss')],
            button: t('ui.continue'),
          });
          stopBob(); stopCheep();
          // the mother flies off to find insects
          await flyMother(648, 279, -60, 90, 1.4);
          mother.setAttribute('opacity', '0');
          await wind();
          await ctx.card({ eyebrow: `${HS.pageNo(4)} · ${t('ch.howto')}`, title: t('nest.boy2'), body: [t('nest.howto')], button: t('ui.start') });
          const r = await carry();
          mother.setAttribute('opacity', '1');
          await flyMother(-60, 90, NEST.x - 40, NEST.y - 30, 2.2);
          HS.setPos(mother, NEST.x - 40, NEST.y - 30, 0, 1.1);
          Sound.chirp(4, 3100);
          ctx.say(t('nest.win'), 4200);
          Sound.win();
          await ctx.wait(2600);
          const slips = r.panics + r.bumps + Math.max(0, tries - 1);
          resolve({ seals: slips <= 1 ? 3 : slips <= 4 ? 2 : 1 });
        });

        function note(text) { return HS.h('p', { class: 'muted' }, text); }
        function zhPoem(text) { return HS.h('p', { class: 'poem-zh', lang: 'zh-CN' }, text); }

        function flyMother(x0, y0, x1, y1, dur) {
          return new Promise((res) => {
            const bird = A.bird({ color: '#8f7b5d', fly: true });
            mother.innerHTML = bird;
            let k = 0;
            const flip = x1 < x0;
            const stop = ctx.loop((dt) => {
              k = Math.min(1, k + dt / dur);
              const x = HS.lerp(x0, x1, k), y = HS.lerp(y0, y1, k) - Math.sin(k * Math.PI) * 60;
              HS.setPos(mother, x, y, 0, 1.1, flip);
              if (k >= 1) { stop(); mother.innerHTML = A.bird({ color: '#8f7b5d' }); res(); }
            });
          });
        }

        function wind() {
          return new Promise((res) => {
            ctx.say(t('nest.wind'), 3800);
            Sound.wind();
            const leaves = [];
            for (let i = 0; i < 14; i++) {
              const el = HS.sprite(leafFx, A.leafShape([C.ochre, '#c26a4a', '#b8b35a'][i % 3]));
              leaves.push({ el, x: 520 + Math.random() * 460, y: 40 + Math.random() * 360, vx: -260 - Math.random() * 200, vy: 40 + Math.random() * 60, r: Math.random() * 360 });
            }
            const chick = HS.sprite(fx, A.fledgling());
            let cy = NEST.y - 6, vy = -120, x = NEST.x - 6, landed = false, clock = 0;
            const stop = ctx.loop((dt) => {
              clock += dt;
              for (const l of leaves) { l.x += l.vx * dt; l.y += l.vy * dt; l.r += 300 * dt; HS.setPos(l.el, l.x, l.y, l.r); }
              const sway = clock < 1.4 ? Math.sin(clock * 30) * 3 : 0;
              chicks.setAttribute('transform', `translate(${sway.toFixed(1)} 0)`);
              if (clock > 0.5 && !landed) {
                vy += 900 * dt; cy += vy * dt; x -= 70 * dt;
                const floor = GROUND_Y - 14;
                if (cy >= floor) { cy = floor; if (Math.abs(vy) < 160) { landed = true; } vy = -vy * 0.35; Sound.bump(); }
                HS.setPos(chick, x, cy, clock * 200 % 360 * (landed ? 0 : 1), 1.1);
              }
              if (landed && clock > 2.2) {
                stop();
                leaves.forEach((l) => l.el.remove());
                HS.setPos(chick, x, GROUND_Y - 14, 0, 1.1);
                ctx.chick = { el: chick, x, y: GROUND_Y - 14 };
                res();
              }
            });
          });
        }

        function carry() {
          return new Promise((res) => {
            const c = ctx.chick;
            const hands = HS.sprite(fx, `<path d="M-22 6C-24 18-8 26 0 24 8 26 24 18 22 6C12 12-12 12-22 6Z" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.4"/>`, { opacity: '0' });
            const meter = ctx.add('meter', `<g transform="translate(40 40)"><text x="0" y="-8" font-size="20" fill="${C.ink2}" font-family="'Ma Shan Zheng','Caveat Brush','KaiTi',serif">${t('nest.fearLabel')}</text><rect x="0" y="0" width="160" height="12" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.2"/><rect class="fear" x="1" y="1" width="0" height="10" fill="${C.seal}"/></g>`);
            const fearBar = meter.querySelector('.fear');
            let held = false, target = null, fear = 0, panic = 0, panics = 0, bumps = 0, bumpCool = 0, lastX = c.x, lastY = c.y, done = false;
            const limit = ctx.easy ? 330 : 240;
            const stat = () => ctx.stat(t('nest.stat', { a: panics, b: bumps }));
            stat();
            const onDown = (e) => {
              if (done) return;
              const p = ctx.point(e);
              if (HS.dist(p.x, p.y, c.x, c.y) < 48 * ctx.reach) {
                held = true; target = p;
                hands.setAttribute('opacity', '1');
                try { ctx.svg.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
                ctx.svg.classList.add('is-dragging');
                Sound.chirp(1, 3400);
              }
            };
            const onMove = (e) => { if (held) target = ctx.point(e); };
            const onUp = () => { held = false; ctx.svg.classList.remove('is-dragging'); };
            ctx.on(ctx.svg, 'pointerdown', onDown);
            ctx.on(ctx.svg, 'pointermove', onMove);
            ctx.on(ctx.svg, 'pointerup', onUp);
            ctx.on(ctx.svg, 'pointercancel', onUp);
            const stop = ctx.loop((dt, now) => {
              bumpCool = Math.max(0, bumpCool - dt);
              let speed = 0;
              if (panic > 0) {
                panic -= dt;
                if (panic <= 0) { ctx.say(t('nest.calm'), 2200); fear = 0.5; }
              } else if (held && target && !done) {
                const nx = c.x + (target.x - c.x) * Math.min(1, dt * 10);
                const ny = Math.min(GROUND_Y - 14, c.y + (target.y - c.y) * Math.min(1, dt * 10));
                speed = Math.hypot(nx - c.x, ny - c.y) / (dt || 0.016);
                if (hitsBranch(nx, ny, 14)) {
                  if (bumpCool <= 0) { bumps++; bumpCool = 0.9; stat(); Sound.bump(); ctx.float(c.x, c.y - 26, '!', C.seal, 30); ctx.say(t('nest.bump'), 1800); fear = Math.min(1, fear + 0.3); }
                } else { c.x = nx; c.y = ny; }
              }
              if (speed > limit) fear += ((speed - limit) / limit) * dt * 1.8;
              else fear = Math.max(0, fear - dt * 0.45);
              if (fear >= 1 && panic <= 0) {
                panic = 1.6; panics++; fear = 1; stat();
                Sound.chirp(4, 3800);
                ctx.say(t('nest.fast'), 3000);
              }
              fearBar.setAttribute('width', (Math.min(1, fear) * 158).toFixed(1));
              const shake = panic > 0 || fear > 0.6 ? (Math.random() - 0.5) * 3 * Math.min(1, fear + (panic > 0 ? 1 : 0)) : 0;
              HS.setPos(c.el, c.x + shake, c.y, 0, 1.1);
              HS.setPos(hands, c.x, c.y + 4, 0, 1);
              lastX = c.x; lastY = c.y;
              if (!done && HS.dist(c.x, c.y, NEST.x, NEST.y - 4) < 34) {
                done = true;
                held = false;
                stop();
                hands.remove();
                meter.remove();
                c.el.remove();
                chicks.innerHTML = nestChicks(true) + A.place(A.chickHead(true), { x: NEST.x - 2, y: NEST.y - 16, s: 1.2 });
                Sound.good();
                res({ panics, bumps });
              }
            });
          });
        }
      });
    },
  });
})();

</script>
<script>
/* 护生之约 · 第五页 · 笼门 (The Cage Door)
 * First you are the thrush inside the cage. Then, outside again,
 * you decide what the bird really needs. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const BOUNDS = { x0: 96, x1: 904, y0: 132, y1: 540 };
  const PERCH = { x0: 300, x1: 700, y: 430 };
  const TREE_SPOTS = [[790, 250], [860, 205], [735, 330], [900, 300]];

  function winterTree(x, y, s = 1) {
    A.seed(81);
    let t = A.stroke([[0, 0], [6, -120], [-4, -260], [4, -380]], 22, { head: 1, tail: 0.4 });
    const limbs = [[[2, -250], [-70, -300], [-130, -360]], [[4, -300], [70, -350], [120, -410]], [[0, -180], [80, -210], [140, -240]], [[-2, -140], [-60, -160], [-110, -190]], [[4, -360], [-20, -420], [-40, -470]]];
    for (const pts of limbs) {
      t += A.stroke(pts, 7, { head: 1, tail: 0.2 });
      const [ex, ey] = pts[2];
      t += A.line([[ex, ey], [ex + A.rnd(-30, 30), ey - A.rnd(20, 40)]], 1.4) + A.line([[ex, ey], [ex + A.rnd(10, 40), ey + A.rnd(-10, 10)]], 1.2);
      t += `<path d="M${pts[1][0] - 20} ${pts[1][1] - 5}q20-8 40 0" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>`;
    }
    return A.place(t, { x, y, s });
  }

  function outsideBg() {
    let s = `<rect width="1000" height="625" fill="#eef0ec"/>`;
    s += A.blob(500, 60, 600, 140, '#c9d6de', 0.35);
    s += A.hills(470, 44, { color: C.indigo, op: 0.13, h: 110 });
    s += A.shape('M-20 540L1020 530 1020 640-20 640Z', '#ffffff', 0.9);
    s += A.line([[-10, 540], [1010, 530]], 1.2, { op: 0.35 });
    s += winterTree(820, 560, 1);
    A.seed(3);
    for (let i = 0; i < 40; i++) s += `<circle cx="${A.rnd(0, 1000).toFixed(0)}" cy="${A.rnd(0, 520).toFixed(0)}" r="${A.rnd(1.2, 2.6).toFixed(1)}" fill="#fff" stroke="${C.ink}" stroke-opacity=".15" stroke-width=".6"/>`;
    return s;
  }

  function bars() {
    const col = '#4a3a28';
    let b = '';
    for (let x = 60; x <= 940; x += 72) {
      const top = 70 + Math.abs(x - 500) * 0.12;
      b += A.stroke([[x, 600], [x + 1, 340], [x, top], [500 + (x - 500) * 0.6, 20]], 5, { color: col, head: 1, tail: 0.6, wob: 0.03 });
    }
    b += `<path d="M40 110C300 80 700 80 960 110" stroke="${col}" stroke-width="7" fill="none"/>`;
    b += `<path d="M20 560C300 575 700 575 980 560L990 625 10 625Z" fill="#8d6b46" fill-opacity=".8" stroke="${C.ink}" stroke-width="2"/>`;
    b += A.stroke([[PERCH.x0 - 30, PERCH.y + 12], [PERCH.x1 + 30, PERCH.y + 12]], 9, { color: '#7a5d3c', head: 1, tail: 1, wob: 0.02 });
    b += `<path d="M150 540L150 510 210 510 210 540Z" fill="${C.paper}" stroke="${C.ink}" stroke-width="1.6"/><ellipse cx="180" cy="512" rx="30" ry="6" fill="#e5cf8a" stroke="${C.ink}" stroke-width="1"/>`;
    return b;
  }

  function outsideScene() {
    let s = outsideBg();
    s += A.eaves(-20, 640, 60);
    s += A.line([[380, 50], [380, 100]], 2);
    return s;
  }

  function painting() {
    let s = outsideScene();
    s += A.place(A.cage({ door: true }), { x: 380, y: 300, s: 1.05 });
    TREE_SPOTS.forEach(([x, y], i) => { s += A.place(A.bird({ brow: i === 0, color: i === 0 ? '#a47d50' : '#8f8676' }), { x, y, s: 0.9, flip: i % 2 === 1 }); });
    s += A.kid({ x: 540, y: 545, s: 1.15, jacket: C.rouge, hair: 'girl', arms: { l: [[-18, -66], [-12, -50]], r: [[24, -90], [36, -112]] } });
    return s;
  }

  function pov() {
    let s = `<rect width="1000" height="420" fill="#eef0ec"/>`;
    s += A.place(A.cage(), { x: 280, y: 390, s: 1.35 }) + A.place(A.bird({ brow: true }), { x: 280, y: 290, s: 1.1 });
    s += winterTree(760, 420, 0.8);
    s += A.place(A.bird({ brow: true, fly: true }), { x: 700, y: 120, s: 1.2, r: -10 });
    return s;
  }

  HS.chapter({
    id: 'cage', key: 'cage', no: 5,
    painting, pov,
    original: 'qiutu',
    play(ctx) {
      return new Promise((resolve) => {
        const t = ctx.t;
        const bg = ctx.add('bg', outsideBg());
        const freeLayer = ctx.layer('free');
        const barsEl = ctx.add('bars', bars());
        const player = ctx.add('player', A.bird({ brow: true, fly: true }));
        const fade = ctx.add('fade', `<rect width="1000" height="625" fill="#f8f4ea"/>`, { opacity: '0' });

        // free birds outside the cage
        const free = TREE_SPOTS.slice(0, 3).map((p, i) => {
          const el = HS.sprite(freeLayer, A.bird({ color: '#8f8676', fly: true }));
          return { el, cx: p[0] - 60, cy: p[1] - 60, r: 60 + i * 30, ph: i * 2, sp: 0.8 + i * 0.25 };
        });

        ctx.say(t('cage.intro2'), 3800);
        let x = 500, y = PERCH.y - 20, vx = 0, vy = 0, perched = true, bumps = 0, clock = 0, stage = 0, steer = 0, steerClock = 0, over = false;
        const keys = {};
        function flap(dir) {
          if (over) return;
          vy = -330;
          perched = false;
          if (dir) { steer = dir; steerClock = 0.45; }
          Sound.tap();
        }
        ctx.on(ctx.svg, 'pointerdown', (e) => {
          e.preventDefault();
          const p = ctx.point(e);
          flap(p.x < 333 ? -1 : p.x > 667 ? 1 : 0);
        });
        const onKey = (e) => {
          if (e.type === 'keydown') {
            if (e.key === ' ' || e.key === 'ArrowUp') { e.preventDefault(); if (!e.repeat) flap(0); }
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); keys[e.key] = true; if (!e.repeat) flap(e.key === 'ArrowLeft' ? -1 : 1); }
          } else keys[e.key] = false;
        };
        ctx.on(window, 'keydown', onKey);
        ctx.on(window, 'keyup', onKey);

        function bump(nx, ny) {
          bumps++;
          Sound.bump();
          ctx.float(nx, ny - 30, t('cage.bump'), C.seal, 28);
          for (let i = 0; i < 3; i++) {
            const f = HS.sprite(ctx.layer('fx'), `<path d="M0 0C4-6 10-6 12 0 6 2 2 2 0 0Z" fill="#a47d50" stroke="${C.ink}" stroke-width=".6"/>`);
            const fx = nx + (Math.random() - 0.5) * 20, fy = ny + (Math.random() - 0.5) * 20;
            HS.setPos(f, fx, fy, Math.random() * 360);
            if (f.animate && !HS.reducedMotion()) f.animate([{ opacity: 1, transform: `translate(${fx}px, ${fy}px)` }, { opacity: 0, transform: `translate(${fx + (Math.random() - 0.5) * 60}px, ${fy + 70}px) rotate(200deg)` }], { duration: 1100 }).onfinish = () => f.remove();
            else ctx.after(800, () => f.remove());
          }
        }

        const stopA = ctx.loop((dt, now) => {
          clock += dt;
          // free birds loop around the tree and sing
          free.forEach((b, i) => {
            const a = now * b.sp + b.ph;
            HS.setPos(b.el, b.cx + Math.cos(a) * b.r, b.cy + Math.sin(a * 1.3) * b.r * 0.5, 0, 0.7, Math.sin(a) > 0);
          });
          if (Math.random() < dt * 0.6) Sound.chirp(2, 2800 + Math.random() * 600);
          if (over) return;
          // the player's bird
          const want = (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0) || (steerClock > 0 ? steer : 0);
          steerClock -= dt;
          vx += (want * 230 - vx) * Math.min(1, dt * 4);
          if (!perched) vy += 760 * dt;
          let nx = x + vx * dt, ny = y + vy * dt;
          if (nx < BOUNDS.x0) { nx = BOUNDS.x0; if (Math.abs(vx) > 50) bump(nx, ny); vx = Math.abs(vx) * 0.5; steer = 1; }
          if (nx > BOUNDS.x1) { nx = BOUNDS.x1; if (Math.abs(vx) > 50) bump(nx, ny); vx = -Math.abs(vx) * 0.5; steer = -1; }
          if (ny < BOUNDS.y0) { ny = BOUNDS.y0; if (vy < -60) bump(nx, ny); vy = Math.abs(vy) * 0.3; }
          if (vy > 0 && y <= PERCH.y - 20 && ny >= PERCH.y - 20 && nx > PERCH.x0 && nx < PERCH.x1) { ny = PERCH.y - 20; vy = 0; perched = true; }
          if (ny > BOUNDS.y1) { ny = BOUNDS.y1; vy = 0; perched = true; }
          if (perched && (nx < PERCH.x0 || nx > PERCH.x1) && ny < BOUNDS.y1 - 1) perched = false;
          x = nx; y = ny;
          if (perched) vx *= 0.85;
          HS.setPos(player, x, y, HS.clamp(vy * 0.03, -20, 25), 1.6, vx < -10);
          player.querySelectorAll('.wing-up, .wing-down').forEach((w) => { w.style.animationPlayState = perched ? 'paused' : 'running'; });
          // thoughts
          if (stage === 0 && clock > 4) { stage = 1; ctx.say(t('cage.th1'), 3200); }
          if (stage === 1 && (bumps >= 2 || clock > 9)) { stage = 2; ctx.say(t('cage.th2'), 3200); }
          if (stage === 2 && (bumps >= 4 || clock > 14)) {
            stage = 3; ctx.say(t('cage.th3'), 4200);
            ctx.after(4200, partB);
          }
        });

        let fadeK = 0;
        function partB() {
          over = true;
          const stopFade = ctx.loop((dt) => {
            fadeK = Math.min(1, fadeK + dt * 1.5);
            fade.setAttribute('opacity', fadeK.toFixed(2));
            if (fadeK >= 1) {
              stopFade();
              stopA();
              barsEl.remove(); player.remove(); freeLayer.remove();
              bg.innerHTML = outsideScene();
              showOutside();
            }
          });
        }

        function showOutside() {
          const cageEl = ctx.add('cage', A.cage({ door: true }));
          HS.setPos(cageEl, 380, 300, 0, 1.05);
          const bird = ctx.add('bird', A.bird({ brow: true }));
          HS.setPos(bird, 380, 300 - 84 * 1.05, 0, 0.95);
          const treeBirds = ctx.add('treebirds', TREE_SPOTS.slice(1).map(([bx, by], i) => A.place(A.bird({ color: '#8f8676' }), { x: bx, y: by, s: 0.9, flip: i % 2 === 0 })).join(''));
          ctx.add('kid', A.kid({ x: 540, y: 545, s: 1.15, jacket: C.rouge, hair: 'girl', arms: { l: [[-18, -66], [-12, -50]], r: [[22, -86], [30, -104]] } }));
          const warm = ctx.add('warm', `<rect width="1000" height="625" fill="#f6dfa0"/>`, { opacity: '0', 'pointer-events': 'none' });
          ctx.svg.appendChild(fade.parentNode);
          let k = 1;
          const stopIn = ctx.loop((dt) => { k = Math.max(0, k - dt * 1.4); fade.setAttribute('opacity', k.toFixed(2)); if (k <= 0) stopIn(); });

          let flown = null;
          function release() {
            flown = new Promise((res) => {
              const door = cageEl.querySelector('.cage-door');
              let f = 0, phase = 0, pause = 0;
              const start = { x: 380, y: 300 - 84 * 1.05 }, doorPos = { x: 380, y: 300 - 40 }, dest = { x: TREE_SPOTS[0][0], y: TREE_SPOTS[0][1] };
              const stop = ctx.loop((dt) => {
                if (phase === 0) {
                  f = Math.min(1, f + dt * 1.6);
                  if (door) door.setAttribute('transform', `translate(-12 0) rotate(${(-f * 100).toFixed(1)} 0 -46) translate(12 0)`);
                  if (f >= 1) { phase = 1; f = 0; Sound.soft(); }
                } else if (phase === 1) {
                  f = Math.min(1, f + dt * 1.2);
                  HS.setPos(bird, HS.lerp(start.x, doorPos.x, f), HS.lerp(start.y, doorPos.y, f) - Math.sin(f * Math.PI) * 14, 0, 0.95);
                  if (f >= 1) { phase = 2; pause = 0.9; }
                } else if (phase === 2) {
                  pause -= dt;
                  if (pause <= 0) { phase = 3; f = 0; bird.innerHTML = A.bird({ brow: true, fly: true }); Sound.chirp(3, 3000); }
                } else if (phase === 3) {
                  f = Math.min(1, f + dt * 0.55);
                  const bx = HS.lerp(doorPos.x, dest.x, f), by = HS.lerp(doorPos.y, dest.y, f) - Math.sin(f * Math.PI) * 180;
                  HS.setPos(bird, bx, by, -10, 0.95);
                  warm.setAttribute('opacity', (f * 0.18).toFixed(2));
                  if (f >= 1) {
                    phase = 4;
                    bird.innerHTML = A.bird({ brow: true });
                    HS.setPos(bird, dest.x, dest.y, 0, 0.9);
                    Sound.song();
                    stop();
                    res();
                  }
                }
              });
            });
          }

          ctx.after(900, () => {
            ctx.dialogue({
              prompt: t('cage.outside'),
              options: [
                { value: 1, label: t('cage.opt1'), reply: t('cage.res1') },
                { value: 2, label: t('cage.opt2'), reply: t('cage.res2') },
                { value: 3, label: t('cage.opt3'), reply: t('cage.res3'), correct: true },
              ],
              onRight: release,
              onWrong: () => Sound.soft(),
            }).then(async () => {
              if (flown) await flown;
              treeBirds.setAttribute('opacity', '1');
              await ctx.wait(800);
              resolve({ seals: 3 });
            });
          });
        }
      });
    },
  });
})();

</script>
<script>
/* 护生之约 · 第六页 · 读画 (Reading Paintings)
 * Three picture riddles built on Feng Zikai's own paintings.
 * When a scan of the original is in images/paintings/, it is shown;
 * otherwise a redrawn sketch that follows the original's composition. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const { h } = HS;

  const floor = (y) => A.blob(500, y + 50, 520, 70, C.ochre, 0.18) + A.line([[60, y], [940, y + 3]], 1.3, { op: 0.45 });

  function sketchAbao() {
    let s = floor(560);
    s += A.place(A.stool(), { x: 600, y: 560, s: 2.4 });
    // the stool wears shoes on its feet
    [[504, 556], [696, 556], [548, 548]].forEach(([x, y], i) => { s += A.place(A.shoe(i === 2 ? C.indigo : C.rouge), { x, y, s: 1.5 }); });
    s += A.kid({ x: 330, y: 560, s: 1.7, legs: 'crouch', hair: 'girl', jacket: '#d98c7e', arms: { l: [[14, -58], [40, -40]], r: [[24, -62], [58, -46]] } });
    s += A.place(A.shoe(C.indigo), { x: 422, y: 488, s: 1.3, r: -20 });
    return s;
  }

  function sketchFeathers() {
    let s = floor(540);
    s += A.place(A.featherDuster(), { x: 520, y: 470, s: 2.2, r: -6 });
    [[330, 500, false], [420, 560, false], [700, 540, true], [640, 590, true]].forEach(([x, y, flip]) => { s += A.place(A.littleChick(), { x, y, s: 2.3, flip }); });
    return s;
  }

  function sketchCrabs() {
    let s = A.blob(500, 600, 560, 110, '#d8c8a6', 0.45);
    s += `<path d="M760 560C760 430 830 360 930 350L1000 350 1000 600Z" fill="#8f877a" fill-opacity=".45" stroke="${C.ink}" stroke-width="2"/><path d="M800 560C810 480 860 440 920 440L920 560Z" fill="#3a3530" fill-opacity=".75"/>`;
    s += A.place(A.crab(), { x: 400, y: 470, s: 2.6, r: -6 });
    s += A.place(A.crab(), { x: 560, y: 430, s: 2.5, r: 14 });
    s += A.place(A.crab(), { x: 590, y: 540, s: 2.6, r: -10 });
    A.seed(2);
    for (let i = 0; i < 18; i++) s += `<circle cx="${A.rnd(80, 900).toFixed(0)}" cy="${A.rnd(560, 660).toFixed(0)}" r="${A.rnd(1.5, 3.5).toFixed(1)}" fill="${C.ink}" fill-opacity=".25"/>`;
    return s;
  }

  const RIDDLES = [
    { id: 'abao', key: 'read.r1', sketch: sketchAbao },
    { id: 'muzhiyu', key: 'read.r2', sketch: sketchFeathers },
    { id: 'fuchi', key: 'read.r3', sketch: sketchCrabs },
  ];

  function painting() {
    let s = `<rect width="1000" height="625" fill="#f3ede1"/>`;
    s += A.blob(500, 580, 520, 60, C.ochre, 0.18);
    const frames = [[190, sketchAbao], [500, sketchFeathers], [810, sketchCrabs]];
    frames.forEach(([x, fn], i) => {
      s += A.line([[x, 40], [x, 90]], 1.4, { op: 0.6 });
      s += `<g transform="translate(${x - 125} 90)"><rect width="250" height="200" fill="#cad4ce" stroke="#a6b6ae"/><rect x="10" y="10" width="230" height="180" fill="#f7f2e7" stroke="${C.ink}" stroke-opacity=".3"/><g transform="translate(10 10) scale(.23 .257)">${fn()}</g></g>`;
      s += `<rect x="${x - 125}" y="${i === 1 ? 300 : 298}" width="250" height="12" fill="#8d6b46" fill-opacity=".7"/>`;
    });
    s += A.place(A.cat(), { x: 500, y: 560, s: 1.05 });
    return s;
  }

  function tipArt(i) {
    if (i === 0) return A.svg(A.swallow(80, 40, 1.6, -10) + A.swallow(150, 62, 1.1, 6) + A.line([[10, 80], [230, 84]], 1.4, { op: 0.6 }), 240, 100);
    if (i === 1) return A.svg(A.kid({ x: 120, y: 98, s: 0.72, jacket: C.rouge, hair: 'girl' }), 240, 100);
    return A.svg(`<rect x="30" y="10" width="150" height="84" fill="#f7f2e7" stroke="${C.ink}" stroke-opacity=".4"/>` + A.place(A.cat(), { x: 90, y: 88, s: 0.52 }) + [0, 1, 2, 3, 4].map((k) => A.stroke([[160, 20 + k * 13], [161, 28 + k * 13]], 3)).join('') + `<rect x="150" y="80" width="10" height="10" fill="${C.seal}"/>`, 240, 100);
  }

  const def = {
    id: 'reading', key: 'read', no: 6, fullscreen: false,
    painting,
    enter(root) {
      const t = HS.t, en = HS.en();
      const { bar, stat } = HS.hud(def);
      const main = h('div', { class: 'reading' });
      root.appendChild(h('section', {}, bar, main));
      let firstTry = 0;

      function intro() {
        main.innerHTML = '';
        main.append(
          h('div', { class: 'card-row' }, h('div', { class: 'guide-cat', html: HS.catSVG() }), h('p', { style: 'font-size:1.1rem' }, t('read.intro'))),
          h('h2', { style: 'font-size:1.6rem' }, t('read.tipsTitle')),
          h('div', { class: 'tips' }, [0, 1, 2].map((i) => h('div', { class: 'tip' }, h('div', { class: 'tip-art', html: tipArt(i) }), h('b', {}, t(`read.tip${i + 1}t`)), h('p', { class: 'muted', style: 'font-size:.98rem' }, t(`read.tip${i + 1}`))))),
          h('p', { class: 'note' }, t('read.note')),
          h('div', { class: 'card-actions', style: 'justify-content:flex-start' }, h('button', { class: 'btn btn-seal', type: 'button', onclick: () => { Sound.unlock(); Sound.page(); riddle(0); } }, t('read.begin'))));
        stat.textContent = '';
      }

      function riddle(i) {
        const r = RIDDLES[i];
        const p = HS.painting(r.id);
        stat.textContent = t('read.stat', { a: i + 1, b: RIDDLES.length });
        main.innerHTML = '';
        window.scrollTo({ top: 0 });
        const answers = t(r.key + '.a');
        const correct = answers[0];
        const list = h('div', { class: 'choice-list' });
        const reveal = h('div', { 'aria-live': 'polite' });
        let tries = 0, solved = false;
        HS.shuffle(answers).forEach((label) => {
          const b = h('button', { class: 'choice', type: 'button' }, label);
          b.addEventListener('click', () => {
            if (solved) return;
            tries++;
            if (label === correct) {
              solved = true;
              if (tries === 1) firstTry++;
              b.classList.add('is-right');
              list.querySelectorAll('button').forEach((x) => { x.disabled = true; });
              Sound.good();
              showReveal();
            } else {
              b.classList.add('is-wrong');
              b.disabled = true;
              Sound.oops();
              reveal.innerHTML = '';
              reveal.appendChild(h('p', { class: 'muted' }, t('read.wrong')));
            }
          });
          list.appendChild(b);
        });
        function showReveal() {
          reveal.innerHTML = '';
          const block = h('div', { class: 'reveal-block' },
            h('p', { class: 'eyebrow', style: 'color:var(--ok)' }, t('read.right')),
            h('p', { class: 'reveal-title', lang: 'zh-CN' }, `《${p.title}》`),
            en ? h('p', { class: 'reveal-sub' }, `${p.titleEn} · ${p.sourceEn}`) : h('p', { class: 'reveal-sub' }, p.source),
            h('p', {}, t(r.key + '.text')),
            p.poem ? HS.originalText(r.id) : null,
            r.id === 'abao' ? h('p', { class: 'quote' }, en ? `“${t('read.r1.quoteEn')}” — ${t('read.r1.quoteBy')}` : `“${t('read.r1.quote')}” ——${t('read.r1.quoteBy')}`) : null,
            h('div', { class: 'card-actions', style: 'justify-content:flex-start' },
              h('button', { class: 'btn btn-seal', type: 'button', onclick: () => { Sound.page(); if (i + 1 < RIDDLES.length) riddle(i + 1); else finish(); } }, i + 1 < RIDDLES.length ? t('read.nextPic') + ' ›' : t('ui.continue'))));
          reveal.appendChild(block);
          const btn = block.querySelector('.btn-seal');
          if (btn) btn.focus({ preventScroll: true });
        }
        main.appendChild(h('div', { class: 'riddle' },
          HS.original(r.id, { sketch: r.sketch(), hideTitle: true }),
          h('div', { class: 'riddle-side' },
            h('p', { class: 'eyebrow', style: 'color:var(--seal);letter-spacing:.1em;font-size:.9rem' }, `${t('read.look')} · ${i + 1} / ${RIDDLES.length}`),
            h('h2', {}, t(r.key + '.q')),
            list, reveal)));
      }

      function finish() {
        main.innerHTML = '';
        stat.textContent = '';
        const ctxLike = h('div', { class: 'card', style: 'margin:0 auto' },
          h('p', { class: 'eyebrow' }, t('ui.pov')),
          h('h2', {}, t('read.povTitle')),
          h('p', {}, t('read.pov')),
          h('p', {}, t('read.win')),
          h('div', { class: 'ask' }, h('b', {}, t('ui.talk')), t('read.ask')),
          h('div', { class: 'card-actions' }, h('button', { class: 'btn btn-seal', type: 'button', onclick: () => { Sound.page(); HS.finishPage(def, Math.max(1, firstTry)); } }, t('ui.toPage'))));
        main.appendChild(ctxLike);
      }

      intro();
    },
  };

  HS.chapter(def);
  HS.readingSketches = { abao: sketchAbao, muzhiyu: sketchFeathers, fuchi: sketchCrabs };
})();

</script>
<script>
/* 护生之约 · 末页 · 我的护生画 (My Own Painting)
 * A small ink-brush studio: brush, pale colour washes and stickers drawn in
 * the same style as the game. The finished picture is mounted with a title,
 * a poem and the painter's own red seal, ready to save. */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const { h } = HS;
  const W = 1200, H = 800;

  const COLORS = [
    { id: 'ink', key: 'studio.ink', color: '#211d1a', alpha: 0.95, wash: false },
    { id: 'light', key: 'studio.lightInk', color: '#3b3632', alpha: 0.4, wash: false },
    { id: 'green', key: 'studio.green', color: '#6f9a55', alpha: 0.32, wash: true },
    { id: 'blue', key: 'studio.blue', color: '#4f7c9e', alpha: 0.3, wash: true },
    { id: 'ochre', key: 'studio.ochre', color: '#c08a45', alpha: 0.32, wash: true },
    { id: 'red', key: 'studio.red', color: '#cf5a4c', alpha: 0.3, wash: true },
  ];
  const SIZES = [{ key: 'studio.thin', w: 4 }, { key: 'studio.mid', w: 9 }, { key: 'studio.thick', w: 18 }];

  const STICKERS = {
    cat: () => A.place(A.cat(), { x: 100, y: 190, s: 1.5 }),
    bird: () => A.place(A.bird({ brow: true }), { x: 100, y: 100, s: 3.2 }),
    swallow: () => A.swallow(100, 100, 4.2, -8),
    fish: () => A.place(A.fish('#d9765a'), { x: 104, y: 100, s: 2.5 }),
    ant: () => A.place(A.ant(true), { x: 92, y: 100, s: 6.5 }),
    butterfly: () => A.place(A.butterfly(C.yellow), { x: 100, y: 96, s: 3.4 }),
    chick: () => A.place(A.littleChick(), { x: 94, y: 110, s: 4.4 }),
    crab: () => A.place(A.crab(), { x: 100, y: 120, s: 2.4 }),
    kid: () => A.kid({ x: 100, y: 190, s: 1.4, hair: 'girl', jacket: C.rouge }),
    moon: () => A.moon(100, 100, 60, { glow: false, sw: 2 }),
    flower: () => A.flower(100, 180, 4.2, C.rouge),
    willow: () => A.willowFringe(60, 140, 0, 4, { count: 3, min: 150, max: 190 }),
  };
  const STICKER_ORDER = ['cat', 'bird', 'swallow', 'fish', 'ant', 'butterfly', 'chick', 'crab', 'kid', 'moon', 'flower', 'willow'];
  const stickerMarkup = (key) => A.svg(STICKERS[key](), 200, 200, { defs: true }).replace('<svg ', '<svg width="200" height="200" ');
  const imgCache = {};
  function stickerImage(key) {
    if (!imgCache[key]) imgCache[key] = HS.svgToImage(stickerMarkup(key)).catch(() => null);
    return imgCache[key];
  }

  function hasCJK(s) { return /[㐀-鿿]/.test(s || ''); }

  HS.screens.studio = {
    enter(root) {
      const t = HS.t, en = HS.en();
      const draft = HS.loadDraft() || {};
      const canvas = h('canvas', { width: W, height: H, 'aria-label': t('studio.drawHint'), role: 'img' });
      const live = h('canvas', { width: W, height: H, style: 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none' });
      const g = canvas.getContext('2d');
      const lg = live.getContext('2d');
      const wrap = h('div', { class: 'canvas-wrap mount' }, h('div', { class: 'painting', style: 'position:relative' }, canvas, live));
      let tool = COLORS[0], size = SIZES[1], sticker = null, stickerSize = 1, stickerFlip = false;
      let actions = [], base = null;
      const hint = h('p', { class: 'muted', style: 'font-size:.9rem', 'aria-live': 'polite' }, t('studio.drawHint'));

      function paper(ctx2) {
        ctx2.save();
        ctx2.globalAlpha = 1;
        ctx2.globalCompositeOperation = 'source-over';
        HS.paperFill(ctx2, W, H, '#f7f1e4');
        ctx2.restore();
      }

      function drawStrokeTo(ctx2, st, upto) {
        const pts = st.pts;
        const n = upto == null ? pts.length : upto;
        ctx2.fillStyle = st.color;
        for (let i = 0; i < n; i++) {
          const b = pts[i];
          const a = pts[i - 1] || b;
          const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
          const wa = a[2], wb = b[2];
          if (len > 0.01) {
            const nx = -dy / len, ny = dx / len;
            ctx2.beginPath();
            ctx2.moveTo(a[0] + (nx * wa) / 2, a[1] + (ny * wa) / 2);
            ctx2.lineTo(b[0] + (nx * wb) / 2, b[1] + (ny * wb) / 2);
            ctx2.lineTo(b[0] - (nx * wb) / 2, b[1] - (ny * wb) / 2);
            ctx2.lineTo(a[0] - (nx * wa) / 2, a[1] - (ny * wa) / 2);
            ctx2.closePath();
            ctx2.fill();
          }
          ctx2.beginPath();
          ctx2.arc(b[0], b[1], wb / 2, 0, Math.PI * 2);
          ctx2.fill();
        }
      }

      const scratch = document.createElement('canvas');
      scratch.width = W; scratch.height = H;
      const sg = scratch.getContext('2d');
      function commitStroke(st) {
        sg.clearRect(0, 0, W, H);
        drawStrokeTo(sg, st);
        g.save();
        g.globalAlpha = st.alpha;
        if (st.wash) g.globalCompositeOperation = 'multiply';
        g.drawImage(scratch, 0, 0);
        g.restore();
      }

      async function drawSticker(ctx2, a) {
        const img = await stickerImage(a.key);
        if (!img) return;
        const s = 220 * a.size;
        ctx2.save();
        ctx2.translate(a.x, a.y);
        if (a.flip) ctx2.scale(-1, 1);
        ctx2.drawImage(img, -s / 2, -s / 2, s, s);
        ctx2.restore();
      }

      let redrawing = Promise.resolve();
      function redraw() {
        redrawing = (async () => {
          paper(g);
          if (base) g.drawImage(base, 0, 0, W, H);
          for (const a of actions) {
            if (a.type === 'stroke') commitStroke(a);
            else await drawSticker(g, a);
          }
        })();
        return redrawing;
      }

      let saveTimer = null;
      function saveDraft() {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
          const d = { title: titleIn.value, poem: poemIn.value, seal: sealIn.value };
          try { d.img = canvas.toDataURL('image/jpeg', 0.85); } catch (e) { /* ignore */ }
          if (!HS.saveDraft(d)) { delete d.img; HS.saveDraft(d); }
        }, 700);
      }

      // drawing
      function toCanvas(e) {
        const r = canvas.getBoundingClientRect();
        return [((e.clientX - r.left) / r.width) * W, ((e.clientY - r.top) / r.height) * H];
      }
      let cur = null, lastT = 0, lastW = 0;
      canvas.addEventListener('pointerdown', async (e) => {
        e.preventDefault();
        Sound.unlock();
        const [x, y] = toCanvas(e);
        if (sticker) {
          const a = { type: 'sticker', key: sticker, x, y, size: stickerSize, flip: stickerFlip };
          actions.push(a);
          await drawSticker(g, a);
          Sound.stamp();
          saveDraft();
          return;
        }
        try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
        lastT = performance.now();
        lastW = size.w * (tool.wash ? 2.6 : 1) * (e.pointerType === 'pen' && e.pressure ? 0.5 + e.pressure : 1);
        cur = { type: 'stroke', color: tool.color, alpha: tool.alpha, wash: tool.wash, pts: [[x, y, lastW * 0.6]] };
        live.style.opacity = String(tool.alpha);
        live.style.mixBlendMode = tool.wash ? 'multiply' : 'normal';
        lg.clearRect(0, 0, W, H);
        drawStrokeTo(lg, cur);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!cur) return;
        const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of events.length ? events : [e]) {
          const [x, y] = toCanvas(ev);
          const prev = cur.pts[cur.pts.length - 1];
          const d = Math.hypot(x - prev[0], y - prev[1]);
          if (d < 1.5) continue;
          const now = performance.now();
          const speed = d / Math.max(1, now - lastT) * 1000;
          lastT = now;
          const baseW = size.w * (tool.wash ? 2.6 : 1) * (ev.pointerType === 'pen' && ev.pressure ? 0.5 + ev.pressure : 1);
          const target = baseW * HS.clamp(1.35 - speed / 1600, 0.45, 1.35);
          lastW = HS.lerp(lastW, target, 0.35);
          cur.pts.push([x, y, lastW]);
          drawStrokeTo(lg, { color: cur.color, pts: cur.pts.slice(-2) }, 2);
        }
      });
      const end = () => {
        if (!cur) return;
        const st = cur;
        cur = null;
        lg.clearRect(0, 0, W, H);
        if (st.pts.length === 1) st.pts.push([st.pts[0][0] + 0.5, st.pts[0][1] + 0.5, st.pts[0][2]]);
        actions.push(st);
        commitStroke(st);
        saveDraft();
      };
      canvas.addEventListener('pointerup', end);
      canvas.addEventListener('pointercancel', end);

      // tool panels
      const colorChips = COLORS.map((c) => {
        const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': c === tool ? 'true' : 'false' }, h('span', { class: 'sw', style: `background:${c.color};opacity:${c.wash ? 0.6 : c.alpha < 0.6 ? 0.55 : 1}` }), t(c.key));
        b.addEventListener('click', () => { tool = c; sticker = null; paint(); Sound.tap(); });
        return b;
      });
      const sizeChips = SIZES.map((sz) => {
        const b = h('button', { class: 'chip', type: 'button', 'aria-pressed': sz === size ? 'true' : 'false' }, h('span', { style: `display:inline-block;width:${Math.max(6, sz.w)}px;height:${Math.max(6, sz.w)}px;border-radius:50%;background:${C.ink}` }), t(sz.key));
        b.addEventListener('click', () => { size = sz; sticker = null; paint(); Sound.tap(); });
        return b;
      });
      const stickerBtns = STICKER_ORDER.map((key) => {
        const b = h('button', { class: 'sticker', type: 'button', 'aria-pressed': 'false', html: A.svg(STICKERS[key](), 200, 200) });
        b.appendChild(h('span', {}, t('studio.sticker.' + key)));
        b.addEventListener('click', () => { sticker = sticker === key ? null : key; paint(); Sound.tap(); });
        return { key, b };
      });
      const sizeRange = h('input', { type: 'range', id: 'hs-sticker-size', min: '0.4', max: '1.8', step: '0.1', value: '1' });
      sizeRange.addEventListener('input', () => { stickerSize = Number(sizeRange.value); });
      const flipBox = h('input', { type: 'checkbox', id: 'hs-sticker-flip', class: 'switch' });
      flipBox.addEventListener('change', () => { stickerFlip = flipBox.checked; });

      function paint() {
        colorChips.forEach((b, i) => b.setAttribute('aria-pressed', !sticker && COLORS[i] === tool ? 'true' : 'false'));
        sizeChips.forEach((b, i) => b.setAttribute('aria-pressed', SIZES[i] === size ? 'true' : 'false'));
        stickerBtns.forEach(({ key, b }) => b.setAttribute('aria-pressed', key === sticker ? 'true' : 'false'));
        wrap.classList.toggle('is-sticker', !!sticker);
        hint.textContent = sticker ? t('studio.stickerHint') : t('studio.drawHint');
      }

      // words
      const titleIn = h('input', { type: 'text', id: 'hs-studio-title', maxlength: '16', placeholder: t('studio.titlePh'), value: draft.title || '' });
      const poemIn = h('textarea', { id: 'hs-studio-poem', rows: '4', maxlength: '80', placeholder: t('studio.poemPh') });
      poemIn.value = draft.poem || '';
      const sealIn = h('input', { type: 'text', id: 'hs-studio-seal', maxlength: '8', placeholder: t('studio.sealPh'), value: draft.seal || HS.playerSealText() });
      [titleIn, poemIn, sealIn].forEach((el) => el.addEventListener('input', saveDraft));
      let insp = -1;
      const inspire = h('button', { class: 'btn btn-small', type: 'button' }, t('studio.inspire'));
      inspire.addEventListener('click', () => { const list = t('studio.inspirations'); insp = (insp + 1) % list.length; poemIn.value = list[insp]; saveDraft(); Sound.soft(); });

      // undo / clear
      const confirmBox = h('div', { class: 'confirm', hidden: true },
        h('p', {}, t('studio.clearAsk')),
        h('div', { class: 'toolbar' },
          h('button', { class: 'btn btn-small btn-seal', type: 'button', onclick: () => { actions = []; base = null; redraw(); confirmBox.hidden = true; saveDraft(); Sound.page(); } }, t('studio.yes')),
          h('button', { class: 'btn btn-small', type: 'button', onclick: () => { confirmBox.hidden = true; } }, t('studio.no'))));
      const undoBtn = h('button', { class: 'btn btn-small', type: 'button', onclick: () => { if (actions.length) { actions.pop(); redraw(); saveDraft(); Sound.tap(); } } }, t('studio.undo'));
      const clearBtn = h('button', { class: 'btn btn-small', type: 'button', onclick: () => { confirmBox.hidden = false; } }, t('studio.clear'));
      const doneBtn = h('button', { class: 'btn btn-seal', type: 'button' }, t('studio.done'));
      doneBtn.addEventListener('click', async () => { await redrawing; mountAndShow(); });

      const onKey = (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !/input|textarea/i.test(e.target.tagName)) { e.preventDefault(); undoBtn.click(); }
      };
      document.addEventListener('keydown', onKey);

      const { bar } = HS.hud({ no: 7, key: 'studio' });
      bar.querySelector('.hud-no').textContent = t('album.studio').split(' · ')[0];
      root.appendChild(h('section', {}, bar, h('div', { class: 'studio' },
        h('div', { class: 'card-row' }, h('div', { class: 'guide-cat', html: HS.catSVG() }), h('p', {}, t('studio.intro'))),
        h('div', { class: 'studio-main' },
          h('div', { style: 'display:grid;gap:.6rem' }, wrap, h('div', { class: 'studio-actions' }, undoBtn, clearBtn, hint), confirmBox),
          h('div', { style: 'display:grid;gap:.8rem' },
            h('div', { class: 'panel' }, h('h3', {}, t('studio.brush')), h('div', { class: 'seg', role: 'group', 'aria-label': t('studio.brush') }, sizeChips), h('div', { class: 'seg', role: 'group', 'aria-label': t('studio.colors') }, colorChips)),
            h('div', { class: 'panel' }, h('h3', {}, t('studio.stickers')), h('div', { class: 'stickers' }, stickerBtns.map((s) => s.b)),
              h('div', { class: 'field' }, h('label', { for: 'hs-sticker-size' }, t('studio.size')), sizeRange),
              h('label', { class: 'setting', for: 'hs-sticker-flip' }, flipBox, h('span', {}, t('studio.flip')))),
            h('div', { class: 'panel' }, h('h3', {}, t('studio.words')),
              h('div', { class: 'field' }, h('label', { for: 'hs-studio-title' }, t('studio.titleLabel')), titleIn),
              h('div', { class: 'field' }, h('label', { for: 'hs-studio-poem' }, t('studio.poemLabel')), poemIn, h('div', {}, inspire)),
              h('div', { class: 'field' }, h('label', { for: 'hs-studio-seal' }, t('studio.sealLabel')), sealIn)),
            doneBtn)))));

      // restore the draft, if any
      if (draft.img) {
        const img = new Image();
        img.onload = () => { base = img; redraw(); };
        img.src = draft.img;
      }
      redraw();
      STICKER_ORDER.forEach(stickerImage);

      async function mountAndShow() {
        Sound.page();
        await HS.fontsReady([['64px "Ma Shan Zheng"', '护生画题诗'], ['40px "Caveat Brush"', 'Aa'], ['24px "Noto Serif SC"', '画']]);
        const out = document.createElement('canvas');
        out.width = 1600; out.height = 1000;
        const o = out.getContext('2d');
        o.fillStyle = '#cad4ce';
        o.fillRect(0, 0, 1600, 1000);
        o.strokeStyle = '#a6b6ae'; o.lineWidth = 2; o.strokeRect(1, 1, 1598, 998);
        o.save(); o.translate(40, 40); HS.paperFill(o, 1520, 920, '#f7f1e4'); o.restore();
        o.strokeStyle = 'rgba(38,34,30,.3)'; o.lineWidth = 1.5; o.strokeRect(40, 40, 1520, 920);
        // the painting
        o.drawImage(canvas, 80, 90, 1080, 720);
        o.strokeStyle = 'rgba(38,34,30,.18)'; o.strokeRect(80, 90, 1080, 720);
        const title = (titleIn.value || '').trim() || t('studio.untitled');
        const poemLines = (poemIn.value || '').split(/\n+/).map((l) => l.trim()).filter(Boolean).slice(0, 4);
        const name = (HS.state.name || '').trim();
        const sealText = (sealIn.value || '').trim() || HS.playerSealText();
        o.fillStyle = '#26221e';
        const brush = '"Ma Shan Zheng","STKaiti","KaiTi",serif';
        let sealX = 1430, sealY = 830;
        const d = new Date();
        const dateText = `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
        if (hasCJK(title + poemLines.join(''))) {
          o.textAlign = 'center'; o.textBaseline = 'top';
          o.font = `76px ${brush}`;
          HS.verticalText(o, [Array.from(title).slice(0, 8).join('')], 1490, 96, 76, 1.2, 1.06);
          o.font = `44px ${brush}`;
          const cols = [];
          poemLines.forEach((l) => { const ch = Array.from(l); for (let i = 0; i < ch.length; i += 13) cols.push(ch.slice(i, i + 13).join('')); });
          HS.verticalText(o, cols.slice(0, 4), 1396, 120, 44, 1.32, 1.1);
        } else {
          o.textAlign = 'left'; o.textBaseline = 'alphabetic';
          o.font = `58px "Caveat Brush", ${brush}`;
          let y = wrapText(o, title, 1200, 170, 330, 62);
          o.font = `italic 30px "Andika", "Trebuchet MS", sans-serif`;
          o.fillStyle = '#3b3632';
          y += 30;
          for (const l of poemLines) y = wrapText(o, l, 1200, y, 330, 40) + 10;
          sealX = 1200; sealY = HS.clamp(y + 20, 620, 830);
        }
        o.textAlign = 'left'; o.textBaseline = 'alphabetic';
        o.font = `24px "Noto Serif SC", "Andika", serif`; o.fillStyle = '#5a524a';
        o.fillText([name ? (HS.en() ? `Painted by ${name}` : `${name} 画`) : '', dateText, '护生之约'].filter(Boolean).join(' · '), 80, 880);
        HS.drawSeal(o, sealText, sealX, sealY, 100);
        HS.showPicture(out, `${title}.png`, { title: t('studio.preview'), alt: title, closeLabel: t('studio.edit') });
      }

      function wrapText(o, text, x, y, maxW, lh) {
        const words = text.split(/\s+/);
        let line = '';
        for (const w of words) {
          const test = line ? line + ' ' + w : w;
          if (o.measureText(test).width > maxW && line) { o.fillText(line, x, y); y += lh; line = w; } else line = test;
        }
        if (line) { o.fillText(line, x, y); y += lh; }
        return y;
      }


      return () => { document.removeEventListener('keydown', onKey); clearTimeout(saveTimer); };
    },
  };
})();

</script>
<script>
/* 护生之约 · 护生小博士 (The Kindness Quiz) and the certificate */
(function () {
  'use strict';
  const A = Art, C = Art.C;
  const { h } = HS;
  const N = 8, PASS = 6;

  async function certificate() {
    const t = HS.t, en = HS.en();
    await HS.fontsReady([['80px "Ma Shan Zheng"', '护生小画师证书丰子恺'], ['60px "Caveat Brush"', 'Little Painter'], ['30px "Noto Serif SC"', '同学走进了画册'], ['30px "Andika"', 'Aa']]);
    const W = 1600, H = 1130;
    const cv = document.createElement('canvas');
    cv.width = W; cv.height = H;
    const g = cv.getContext('2d');
    g.fillStyle = '#cad4ce'; g.fillRect(0, 0, W, H);
    g.save(); g.translate(44, 44); HS.paperFill(g, W - 88, H - 88, '#f8f2e5'); g.restore();
    g.strokeStyle = '#b5362c'; g.lineWidth = 4; g.strokeRect(80, 80, W - 160, H - 160);
    g.lineWidth = 1.5; g.strokeRect(94, 94, W - 188, H - 188);
    // pictures: willow on the left, the cat and chicks at the bottom
    const art = A.svg(A.willow(150, 560, 0.95, 11, { long: 220 }) + A.place(A.cat(), { x: 170, y: 640, s: 0.9 }) + A.place(A.littleChick(), { x: 260, y: 632, s: 1.6 }), 400, 660, { defs: true }).replace('<svg ', '<svg width="400" height="660" ');
    const img = await HS.svgToImage(art).catch(() => null);
    if (img) g.drawImage(img, 100, 380, 400 * 0.95, 660 * 0.95);
    const brush = '"Ma Shan Zheng","STKaiti","KaiTi",serif';
    g.fillStyle = '#26221e'; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    if (en) {
      g.font = `96px "Caveat Brush", ${brush}`;
      g.fillText(t('cert.title'), W / 2, 250);
      g.font = `40px "Andika", sans-serif`; g.fillStyle = '#8c271f';
      g.fillText(t('cert.word').toUpperCase(), W / 2, 310);
    } else {
      g.font = `118px ${brush}`;
      g.fillText(t('cert.title'), W / 2, 262);
      g.font = `46px ${brush}`; g.fillStyle = '#8c271f';
      g.fillText(t('cert.word'), W / 2, 330);
    }
    const P = HS.progress();
    const name = (HS.state.name || '').trim() || t('cert.anon');
    const body = t('cert.body', { name, pages: P.done, seals: P.seals });
    g.fillStyle = '#26221e';
    g.font = en ? '36px "Andika", "Trebuchet MS", sans-serif' : '38px "Noto Serif SC", "Songti SC", serif';
    g.textAlign = 'left';
    wrap(g, body, 520, 440, 900, en ? 56 : 64, !en);
    g.textAlign = 'center';
    g.font = `52px ${brush}`; g.fillStyle = '#8c271f';
    g.fillText(HS.zh('cert.quote') + '　——' + HS.zh('cert.quoteBy'), W / 2 + 160, 800);
    if (en) { g.font = 'italic 30px "Andika", sans-serif'; g.fillStyle = '#5a524a'; g.fillText(`“${t('cert.quoteEn')}” — ${t('cert.quoteBy')}`, W / 2 + 160, 850); }
    const d = new Date();
    g.font = '28px "Noto Serif SC", "Andika", serif'; g.fillStyle = '#5a524a'; g.textAlign = 'right';
    g.fillText(`${t('cert.issuer')} · ${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`, W - 290, H - 150);
    HS.drawSeal(g, HS.playerSealText(), W - 260, H - 250, 120);
    return cv;
  }

  function wrap(g, text, x, y, maxW, lh, cjk) {
    const units = cjk ? Array.from(text) : text.split(/(\s+)/);
    let line = '';
    for (const u of units) {
      const test = line + u;
      if (g.measureText(test).width > maxW && line.trim()) { g.fillText(line.trim(), x, y); y += lh; line = u.trim() ? u : ''; } else line = test;
    }
    if (line.trim()) g.fillText(line.trim(), x, y);
    return y;
  }

  HS.certificate = certificate;

  HS.screens.quiz = {
    enter(root) {
      const t = HS.t, en = HS.en();
      const { bar, stat } = HS.hud({ no: 8, key: 'quiz' });
